<title>Clinical Physiology Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a bay in the emergency department. The patient on the left, the conversation and findings in the middle, what you see and hear above them. */
:root {
  --bg: #edf1f0;
  --surface: #fbfcfc;
  --sunk: #e3e9e7;
  --fg: #15201e;
  --muted: #5a6a67;
  --line: #d0dad7;
  --accent: #1f6f66;          /* scrub teal */
  --accent-fg: #ffffff;
  --accent-soft: #d6ebe7;
  --abn: #9a3412;
  --abn-soft: #fbe7dc;
  --ok: #1f7a4a;
  --grid: #dfe6e4;
  --trace: #15201e;
  --systole: rgba(31, 111, 102, 0.08);
  --gown: #9fc4d9;
  --gown-dot: #7fa9c2;
  --bed: #c9d3d1;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #162020; --sunk: #1c2828; --fg: #e3ebe9; --muted: #92a4a0; --line: #2a3836;
    --accent: #4fb3a6; --accent-fg: #062320; --accent-soft: #173b37; --abn: #f0a07c; --abn-soft: #3a2218; --ok: #6fcf97;
    --grid: #233130; --trace: #e3ebe9; --systole: rgba(79, 179, 166, 0.12); --gown: #5f8aa3; --gown-dot: #4b7590; --bed: #2e3b3a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #162020; --sunk: #1c2828; --fg: #e3ebe9; --muted: #92a4a0; --line: #2a3836;
  --accent: #4fb3a6; --accent-fg: #062320; --accent-soft: #173b37; --abn: #f0a07c; --abn-soft: #3a2218; --ok: #6fcf97;
  --grid: #233130; --trace: #e3ebe9; --systole: rgba(79, 179, 166, 0.12); --gown: #5f8aa3; --gown-dot: #4b7590; --bed: #2e3b3a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font-body); }
#vp { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
h1 { font: 700 clamp(1.5rem, 3.6vw, 2.2rem)/1.15 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font: 700 0.78rem/1.2 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
.ghost.small, .tog.small { padding: 3px 10px; font-size: 0.85rem; }
.primary { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; }
.primary:disabled { opacity: .45; cursor: default; }
.tog { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }

/* ward */
#ward .lede { color: var(--muted); max-width: 62ch; margin: 8px 0 22px; }
#ward-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.bedcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 6px; align-content: start; }
.bed-place { font: 500 12px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.bedcard h2 { font: 700 1.35rem/1.2 var(--font-display); color: var(--fg); text-transform: none; letter-spacing: 0; margin: 0; }
.bed-meta { color: var(--muted); }
.bed-triage { margin: 6px 0 12px; font-style: italic; }
.bedcard .primary { justify-self: start; }

/* encounter */
.enc-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
.enc-bar .who { flex: 1 1 220px; min-width: 0; }
.enc-bar .who b { font: 700 1.25rem/1.2 var(--font-display); display: block; }
.enc-bar .who span { color: var(--muted); font-size: .92rem; }
#clock { font: 500 14px var(--font-mono); padding: 4px 10px; border-radius: 999px; background: var(--sunk); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.figure-panel { padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.figure-panel > * { min-width: 0; }
.act, .act-pair span { hyphens: auto; }
#figure { width: 100%; height: auto; display: block; max-height: 380px; }
#figure [data-region] { cursor: pointer; }
#figure [data-region]:hover { filter: brightness(0.95); }
.skin { fill: var(--skin); stroke: var(--skin-shade); stroke-width: 1.5; }
#gown, #gown-low { pointer-events: none; transition: opacity .25s; }
#bed { transition: opacity .25s; }

@media (prefers-reduced-motion: reduce) { #gown, #gown-low, #bed { transition: none; } }
#state-line { font-size: .88rem; color: var(--muted); }
#touch-hint { font-size: .88rem; color: var(--muted); margin: 0; }
#region { border-top: 1px solid var(--line); padding-top: 10px; }
.region-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.act { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; }
.act-pair { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px 5px 10px; background: var(--bg); }
.act-pair > span:first-child { flex: 1 1 8em; }
.act-row .act-pair { flex: 1; min-width: 0; }
.act-pair .sides { display: flex; gap: 6px; margin-left: auto; }

.work { display: grid; gap: 12px; min-width: 0; }
#visual { padding: 12px; }
.eyehost { height: clamp(220px, 34vw, 320px); }
.eyehost canvas, .facecanvas-host canvas { width: 100%; height: 100%; display: block; border-radius: 10px; }
.facehost { display: grid; gap: 6px; justify-items: center; }
.facecanvas-host { width: min(100%, 320px); aspect-ratio: 560 / 760; }
.face-caption { font: 500 13px var(--font-mono); color: var(--muted); }
.trace-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.trace-label { font: 500 12px var(--font-mono); color: var(--muted); }
canvas.phono { width: 100%; height: 140px; display: block; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 8px 10px 0; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 700; }
.tabbody { padding: 14px; height: 420px; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
@media (max-width: 860px) { .tabbody { height: 360px; } }
.f-scene { font-style: italic; color: var(--muted); }
.spk { font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.f-you, .f-patient { display: grid; gap: 2px; padding: 8px 12px; border-radius: 12px; max-width: 88%; }
.f-you { justify-self: end; background: var(--accent-soft); }
.f-patient { justify-self: start; background: var(--sunk); }
.f-patient.companion { background: transparent; border: 1px dashed var(--line); }
.f-act { font: 500 13px var(--font-mono); color: var(--accent); margin-top: 4px; }
.f-blocked { color: var(--abn); font-size: .95rem; }
.f-finding { padding: 6px 10px; border-left: 3px solid var(--grid); }
.f-finding.abn { border-left-color: var(--abn); }
.f-finding.result { border-left-color: var(--accent); }
.f-signs { padding: 2px 10px 6px; border-left: 3px solid var(--abn); }
.f-signs .chips { align-items: center; margin: 2px 0; }
.f-signs .lbl { font: 500 12px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
.f-signs details summary { font-size: .84rem; color: var(--muted); cursor: pointer; margin: 2px 0; }
.f-signs .chip, #tab-notes .chip { cursor: pointer; }
.f-system { color: var(--muted); font-size: .95rem; }
.f-side { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#tab-notes h3 { font: 700 .95rem var(--font-body); margin: 6px 0 0; }
#tab-notes p { margin: 0; }
#tab-mine textarea { width: 100%; min-height: 380px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
/* the examination menu */
.region-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; align-content: start; }
.region-list details.sys { min-width: 0; }
.sec-head { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 8px 0 2px; }
.sec-head:first-child { margin-top: 0; }
.region-list details.sys { border-bottom: 1px solid var(--line); padding: 4px 0 6px; }
.region-list details.sys > summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
.region-list details.sys[open] > summary { margin-bottom: 2px; }
.region-list details.sys > .act-row { margin-bottom: 4px; }
.act-row { display: flex; gap: 4px; align-items: stretch; }
.act-row .act { flex: 1; min-width: 0; }
.info { flex: none; width: 26px; min-height: 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font: italic 700 14px/1 Georgia, serif; padding: 0; align-self: center; }
.info:hover { background: var(--accent-soft); }
/* position, exposure and oxygen */
#care { display: grid; gap: 8px; }
.care-row { display: grid; gap: 4px; }
.care-row select { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 5px 8px; font: inherit; font-size: .92rem; }
.care-label { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 2px 9px; font-size: .84rem; }
.care-row:has(select) { grid-template-columns: auto 1fr; align-items: center; gap: 10px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
/* suggestions */
.cmdwrap { position: relative; flex: 1; min-width: 0; display: flex; }
#suggest { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: min(360px, 55vh); overflow: auto; }
#suggest.below { bottom: auto; top: calc(100% + 6px); }
#suggest ul { list-style: none; margin: 0; padding: 4px; }
#suggest li { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
#suggest li[aria-selected="true"], #suggest li:hover { background: var(--accent-soft); }
.sug-kind { flex: none; font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); min-width: 6.5em; }
@media (max-width: 520px) { #suggest li { flex-wrap: wrap; row-gap: 2px; } .sug-kind { flex-basis: 100%; background: none; border: 0; padding: 0; } }
.sug-kind.order { color: var(--accent); }
.sug-main { flex: 1; min-width: 0; display: grid; }
.sug-also { font-size: .82rem; color: var(--muted); font-style: italic; }
.sug-where { font-size: .78rem; color: var(--muted); }
.sug-hint { margin: 0; padding: 10px 12px; color: var(--muted); font-size: .9rem; }
/* the teaching card */
#card { position: fixed; inset: 0; background: rgba(10, 16, 15, 0.45); display: grid; place-items: center; padding: 16px; z-index: 11; }
#card[hidden] { display: none; }
.teach-card { width: min(620px, 100%); max-height: 90vh; overflow: auto; padding: 18px; display: grid; gap: 10px; }
.teach-card .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.teach-card h2 { font: 700 1.35rem/1.2 var(--font-display); margin: 2px 0 4px; text-transform: none; letter-spacing: 0; color: var(--fg); }
.teach-card h3 { font: 700 .95rem var(--font-body); margin: 0 0 4px; }
.teach-card section p { margin: 0 0 4px; }
.teach-card ol, .teach-card ul { margin: 0; padding-left: 1.3em; display: grid; gap: 3px; }
.teach-card ul.abn { list-style: none; padding: 0; gap: 8px; }
.teach-card ul.abn li { border-left: 3px solid var(--abn); padding-left: 10px; }
.teach-card .small { font-size: .88rem; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
#cmdform { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
#cmd { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--fg); font: inherit; }

/* commit */
#commit { position: fixed; inset: 0; background: rgba(10, 16, 15, 0.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
.commit-card { width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 18px; display: grid; gap: 12px; }
#ddx-q { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--fg); font: inherit; }
#ddx-hits { display: flex; flex-wrap: wrap; gap: 6px; }
.hit { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; }
#ddx-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
#ddx-list li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
#ddx-list .rank { font: 500 13px var(--font-mono); color: var(--muted); width: 1.2em; }
#ddx-list .dx { flex: 1; min-width: 0; }
#ddx-list select { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 4px; font: inherit; font-size: .9rem; }
.commit-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* debrief */
#debrief { display: grid; gap: 22px; max-width: 900px; }
.db-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.eyebrow { font: 500 12px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.verdict { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); }
.verdict.no { border-left-color: var(--abn); }
.verdict.partly { border-left-color: var(--accent); }
.db-time { font: 500 13px var(--font-mono); color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.summary { max-width: 70ch; margin: 0; }
.evidence { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.evidence li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.evidence li p { margin: 6px 0 0; }
.evidence .finding { font-size: .93rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 8px; }
.ev-top { display: flex; align-items: center; gap: 8px; }
/* who names the signs (observe only, ADR-016) */
.ward-level { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 0 18px; }
.ward-level .lv-label { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 14px; font-size: .92rem; }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-fg); }
.small { font-size: .88rem; }
.chip.pick { border-style: dashed; }
.chip.pick[aria-pressed="true"] { border-style: solid; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.f-name .lbl { margin: 0 0 4px; font-size: .9rem; color: var(--muted); }
.name-q { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 4px 0 8px; }
.obs-badge { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 8px; }
.doc-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.doc-lists h3 { font: 700 .78rem/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.doc-lists ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.doc-lists li .muted { font-size: .88rem; }
.ev-sign { margin: 8px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.evidence li.miss .ev-sign .chip { opacity: .8; }
.mark { font-weight: 700; }
.got .mark { color: var(--ok); } .miss .mark { color: var(--abn); }
.state { font: 500 12px var(--font-mono); color: var(--muted); }
.pill { font: 500 11px var(--font-mono); padding: 2px 8px; border-radius: 999px; background: var(--sunk); text-transform: uppercase; letter-spacing: .04em; }
.pill.essential { background: var(--abn-soft); color: var(--abn); }
.pill.discriminating { background: var(--accent-soft); color: var(--accent); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mono li { font: 13px/1.5 var(--font-mono); overflow-wrap: anywhere; }
.notes-compare > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.notes-compare h3 { font: 700 .95rem var(--font-body); margin: 8px 0 2px; }
.notes-compare p { margin: 0; }

/* ---- app shell: layers ------------------------------------------------------- */
.layers { display: flex; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 12px; overflow-x: auto; max-width: 100%; }
.layers button { border: 0; background: none; border-radius: 9px; padding: 7px 14px; white-space: nowrap; color: var(--muted); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.layers button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.layers button[disabled] { opacity: .55; cursor: not-allowed; }
.layers .lock { font-size: .8em; }
.layer-note { color: var(--muted); font-size: .92rem; margin: 0 0 12px; }
.locked { padding: 28px; text-align: center; color: var(--muted); }
.locked b { display: block; color: var(--fg); font: 700 1.1rem var(--font-display); margin-bottom: 6px; }
.bedcard.free { border-style: dashed; }
.tag { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); justify-self: start; }

/* ---- focused views ------------------------------------------------------------- */
.focus-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 700px) { .focus-grid { grid-template-columns: minmax(0, 1fr); } }
.thorax { width: 100%; max-width: 420px; display: block; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.thorax .hit { cursor: crosshair; }
.focus-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.focus-caption { font: 500 12px var(--font-mono); color: var(--muted); margin: 6px 0 0; }
.electrode { cursor: grab; }
.electrode:active { cursor: grabbing; }
.tray { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip-el { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 4px; background: var(--surface); font: 600 12px var(--font-mono); cursor: grab; touch-action: none; }
.chip-el i { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #333; display: inline-block; }
.chip-el[aria-pressed="true"] { outline: 2px solid var(--accent); }
.chip-el.placed { opacity: .45; }
.ecg-live { margin-top: 14px; }
canvas.ecg-monitor { width: 100%; height: 300px; display: block; border-radius: 10px; }
@media (max-width: 560px) { canvas.ecg-monitor { height: 460px; } }
.bed-monitor { display: block; width: 100%; padding: 0; border: 0; border-radius: 10px; background: #0c1412; cursor: pointer; overflow: hidden; }

/* ---- model lab -------------------------------------------------------------------- */

.monitor div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }

/* report a problem (report.ts) */

  font: 500 13px var(--font-mono); background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }

  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 10px 12px; font-size: 13px; overflow-wrap: anywhere; }

/* ---- practice: cardiac arrest (ADR-018) ---------------------------------------- */
.ar-head-buttons { display: flex; flex-wrap: wrap; gap: 8px; max-width: 100%; }
