.hs circle:first-child { fill: color-mix(in srgb, var(--rose) 14%, transparent); stroke: var(--rose); stroke-width: 1.5; stroke-dasharray: 3 3;
  opacity: .8; transition: fill .15s, opacity .15s; animation: hs-pulse 2.6s ease-in-out infinite; }
.hs:hover circle:first-child, .hs:focus circle:first-child { fill: color-mix(in srgb, var(--rose) 32%, transparent); opacity: 1; }
.hs-core { fill: var(--rose); }
@keyframes hs-pulse { 0%, 100% { stroke-opacity: .5; } 50% { stroke-opacity: 1; } }
.pt-svg[data-tool="listen"] .hs circle:first-child { stroke: var(--volume); fill: color-mix(in srgb, var(--volume) 14%, transparent); }
.pt-svg[data-tool="listen"] .hs-core { fill: var(--volume); }
.pt-svg[data-tool="instruct"] .hs circle:first-child { stroke: var(--la); fill: color-mix(in srgb, var(--la) 12%, transparent); }
.pt-svg[data-tool="instruct"] .hs-core { fill: var(--la); }
.pt-stetho circle:first-child { fill: #C9D1D9; stroke: #6B7785; stroke-width: 3; }
.pt-stetho circle:last-child { fill: #8A96A3; }
.pt-stetho { transition: transform .35s cubic-bezier(.3,.8,.3,1); pointer-events: none; }

.pt-bubble { opacity: 0; transition: opacity .25s; pointer-events: none; }
.pt-bubble.show { opacity: 1; }
.pt-bubble rect, .pt-bubble path { fill: #fff; stroke: rgba(0,0,0,.12); }
.pt-bubble text { font: 11.5px var(--sans); fill: #1E1A19; }

.bs-tools { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 8px; border-top: 1px solid var(--hairline); }
.bs-tool { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: var(--r-md);
           font-size: 11.5px; color: var(--text-2); border: 1px solid transparent; transition: background .15s, border-color .15s, color .15s; }
.bs-tool:hover { background: var(--panel-2); color: var(--text); }
.bs-tool.on { background: var(--rose-dim); border-color: color-mix(in srgb, var(--rose) 45%, transparent); color: var(--text); }
.bs-ti { font-size: 18px; line-height: 1; }

.bs-steth { border-top: 1px solid var(--hairline); padding: 10px 14px 12px; }
.bs-steth[hidden] { display: none; }
.bs-steth-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bs-pcg { width: 100%; height: 72px; display: block; color: var(--ecg); margin: 6px 0;
          background-image: linear-gradient(var(--grid-fine) 1px, transparent 1px), linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px);
          background-size: 12px 12px; border-radius: var(--r-sm); }
.bs-steth-t { font-size: 13px; }

.bs-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.bs-choices { display: flex; flex-direction: column; gap: 5px; }
.bs-choices.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.bs-choice { text-align: left; padding: 8px 11px; border-radius: var(--r-sm); border: 1px solid var(--hairline);
             font-size: 13px; color: var(--text-2); transition: background .15s, border-color .15s, color .15s; }
.bs-choice:hover { background: var(--panel-2); color: var(--text); border-color: var(--muted); }
.bs-choice.done { color: var(--muted); border-style: dashed; }
.bs-choice.done::before { content: "✓ "; color: var(--good); }
.bs-sub { font: 500 9.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.bs-q { border-top: 1px solid var(--hairline-2); padding: 6px 0; }
.bs-q summary { cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 4px 0; color: var(--text-2); }
.bs-q[open] summary { color: var(--text); margin-bottom: 4px; }

.bs-log { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; max-height: 460px; overflow-y: auto; scroll-behavior: smooth; }
.lg-sys { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 10px; border: 1px dashed var(--hairline); border-radius: var(--r-md); }
.lg-doc, .lg-pt { display: flex; }
.lg-doc { justify-content: flex-end; }
.lg-doc span, .lg-pt span { max-width: 82%; padding: 7px 11px; border-radius: 14px; font-size: 13px; line-height: 1.45; }
.lg-doc span { background: var(--rose-dim); border: 1px solid color-mix(in srgb, var(--rose) 30%, transparent); border-bottom-right-radius: 4px; }
.lg-pt span { background: var(--panel-2); border: 1px solid var(--hairline); border-bottom-left-radius: 4px; }
.lg-act { font: 10.5px var(--mono); letter-spacing: .06em; color: var(--muted); margin-top: 4px; }
.lg-find { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline;
           padding: 7px 10px; border-radius: var(--r-md); border: 1px solid var(--hairline); background: var(--panel); }
.lg-find.abn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 6%, var(--panel)); }
.lg-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); align-self: center; }
.lg-find.abn .lg-dot { background: var(--warn); }
.lg-t { font-size: 13px; line-height: 1.45; }
.lg-whyb { font: 10px var(--mono); color: var(--muted); padding: 2px 6px; border-radius: 99px; border: 1px solid var(--hairline); }
.lg-whyb:hover { color: var(--text); }
.lg-why { grid-column: 2 / span 2; font-size: 12px; color: var(--text-2); margin-top: 3px; }
.lg-why[hidden] { display: none; }
.lg-kind { font: 600 9px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px; border-radius: 99px; }
.lg-kind.model { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.lg-kind.heuristic { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.lg-kind.case { color: var(--volume); background: color-mix(in srgb, var(--volume) 12%, transparent); }

.bs-pc-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: center; }
.bs-avatar { width: 76px; height: 96px; overflow: hidden; border-radius: var(--r-md); background: var(--panel-2); }
.bs-avatar svg { width: 150px; margin: -8px 0 0 -37px; pointer-events: none; }
.bs-avatar .pt-hotspots, .bs-avatar .pt-bubble, .bs-avatar .pt-stetho { display: none; }

@media (max-width: 560px) {
  .bs-tool { font-size: 10.5px; padding: 6px 2px; }
  .bs-ti { font-size: 16px; }
  .pt-svg { max-height: 50vh; }
  .bs-log { max-height: 380px; }
  .bs-head .btn-row { width: 100%; }
}

/* The welcome card must scroll on short screens, or its Start button is unreachable. */
.first-run { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.fr-card { max-height: calc(100dvh - 40px); overflow-y: auto; margin: auto; }
@media (max-width: 560px) {
  .first-run { padding: 12px; place-items: start center; }
  .fr-card { padding: 18px 18px; }
  .fr-list { font-size: 13px; }
  .fr-list li { margin-bottom: 6px; }
}

/* Narrow screens: the primary rail scrolls sideways inside itself instead of
   widening the page (which made phones zoom out and misplace overlays). */
.transport[hidden] { display: none; }
@media (max-width: 760px) {
  .rail { gap: 8px; padding: 0 10px; }
  .rail .tabs.domains { flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; margin-left: 0; }
  .rail .tabs.domains::-webkit-scrollbar { display: none; }
  .rail .tab { flex-shrink: 0; }
  .rail .rail-spacer { display: none; }
  .transport .speed { display: none; }
  .subrail .tabs { overflow-x: auto; scrollbar-width: none; }
  .space-tagline { display: none; }
}
.bs-last { display: none; }
@media (max-width: 999px) {
  .bs-last:not(:empty) { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 56px; z-index: 30;
    padding: 9px 12px; border-radius: var(--r-md); border: 1px solid var(--hairline); font-size: 13px; line-height: 1.45;
    background: color-mix(in srgb, var(--panel-2) 94%, transparent); box-shadow: var(--shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .bs-last.abn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .bs-last-k { font: 600 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--rose); }
}

/* Native controls (selects, checkboxes, scrollbars) follow the active theme. */
:root { color-scheme: dark; }
[data-theme="paper"] { color-scheme: light; }
.fr-start { min-width: 140px; min-height: 44px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.first-run, .first-run * { touch-action: manipulation; }

ression in aVR \u2014 the classic sign","No reciprocal changes anywhere","Concave-up ST morphology"],teaching:"Diffuse elevation plus aVR depression plus no reciprocals is pericarditis. The giveaway is that the changes do not respect a coronary territory. The clinical picture (young, pleuritic, post-viral, positional) fits."},{title:"Young athlete, screening ECG",vignette:"22-year-old male college athlete. Routine pre-participation ECG. Entirely asymptomatic.",pathId:"early_repol",options:["stemi_ant","pericarditis","early_repol","brugada1"],findings:["ST elevation V2\u2013V5, concave-up",'Prominent J-point notching ("fishhook")',"No reciprocal change, no symptoms","Common in young, athletic, often male patients"],teaching:"Benign early repolarisation. The discriminators against STEMI are: no symptoms, concave morphology, no reciprocals, and J-point notching. It is stable over serial tracings."}]},{name:"Wide QRS",teaches:"The single most consequential call in emergency ECG reading.",cases:[{title:"Wide QRS, fast, unwell",vignette:"65-year-old man. Palpitations and lightheadedness. BP 90/60, HR 150.",pathId:"vt",options:["vt","lbbb","rbbb","wpw_a"],findings:["Wide QRS (>120 ms) with a rate of 150","No identifiable P waves","AV dissociation where visible","Haemodynamically compromised","Rule: wide complex tachycardia is VT until proven otherwise"],teaching:"A wide complex tachycardia in an older patient with haemodynamic compromise is VT. Bundle branch block would still show P waves at a normal rate. Watch the pressure trace here \u2014 filling time collapses and the atrial kick is lost, so cardiac output falls even though the rate has doubled."},{title:"Wide QRS, normal rate, well",vignette:"72-year-old woman. Routine ECG before hip surgery. Asymptomatic, HR 68.",pathId:"lbbb",options:["lbbb","rbbb","wpw_a","hyperk_mod"],findings:["Wide QRS with an M-shaped notched R in V5, V6 and I","Deep S wave in V1","Discordant ST-T (opposite to the QRS)","Normal rate, P waves present"],teaching:"LBBB: wide QRS, M-shaped R laterally, deep S in V1, discordant ST/T. RBBB shows rsR\u2032 in V1 instead. WPW has a short PR and a delta wave. Hyperkalaemia would peak the T waves first."},{title:"Short PR with a slurred upstroke",vignette:"28-year-old man. Episodes of rapid palpitations since his teens. Otherwise healthy.",pathId:"wpw_a",options:["wpw_a","lbbb","rbbb","lvh"],findings:["Short PR interval (<120 ms)","Delta wave: slurred QRS upstroke","Wide QRS as a consequence of the delta wave","Young patient with episodic palpitations"],teaching:"Short PR + delta wave + wide QRS is Wolff\u2013Parkinson\u2013White. The accessory pathway conducts faster than the AV node, so it pre-excites the ventricle. The palpitations are re-entrant tachycardia around that circuit."}]},{name:"T wave changes",teaches:"Which T wave abnormalities mean an artery is about to close.",cases:[{title:"Deep T inversions, pain now resolved",vignette:"55-year-old woman. Chest pain 6 hours ago, now completely resolved. Troponin mildly elevated.",pathId:"wellens",options:["wellens","nstemi","pe","lvh"],findings:["Deep, symmetric T inversions in V2\u2013V3 (\xB1 V4)","Pain-free at the time of the tracing","Minimal ST change","Preserved R wave progression"],teaching:"Wellens syndrome: deep symmetric T inversions in V2\u2013V3 during a pain-free interval signal critical proximal LAD stenosis. This is a pre-infarction pattern. The patient needs catheterisation, not a stress test \u2014 stressing them can complete the infarct."},{title:"ST depression with ongoing pain",vignette:"68-year-old diabetic. Chest pressure for 4 hours, still present. Troponin rising.",pathId:"nstemi",options:["nstemi","wellens","stemi_ant","digitalis"],findings:["ST depression across V3\u2013V6","T wave inversion in the same leads","No ST elevation anywhere","Ongoing symptoms with a rising troponin"],teaching:"ST depression plus T inversion with ongoing ischaemia and a rising troponin is NSTEMI \u2014 the injury is subendocardial rather than transmural. Unlike Wellens, the patient is symptomatic now and the distribution is broader."}]},{name:"Bradycardia and block",teaches:"Where in the conduction system the fault sits, and whether it needs a pacemaker.",cases:[{title:"Dizzy spells, dropped beats",vignette:"78-year-old man on a beta-blocker. Dizzy spells. HR varies between 45 and 60.",pathId:"wenckebach",options:["wenckebach","mobitz2","chb","af"],findings:["P waves present with progressively lengthening PR","One QRS dropped after the longest PR","The pattern repeats \u2014 group beating","Usually benign; often drug-related"],teaching:"Wenckebach (Mobitz I): progressive PR prolongation then a dropped beat. The block is in the AV node itself, which is why it responds to atropine and to stopping the beta-blocker. Mobitz II has a constant PR and blocks below the node \u2014 that one needs a pacemaker."},{title:"Syncope, P waves marching through",vignette:"82-year-old. Syncope. HR 38. P waves visible but unrelated to the QRS complexes.",pathId:"chb",options:["chb","wenckebach","mobitz2","af"],findings:["P waves at their own rate (~75/min)","QRS at a slow escape rate (~40/min)","No fixed relationship between P and QRS","Needs pacing"],teaching:"Complete heart block: the atria and ventricles are electrically divorced. The key finding is dissociation \u2014 P waves march through at a faster, independent rate. Watch the pressure trace: the long diastole overfills the ventricle, so each stroke volume is large, but at 40/min the cardiac output still falls."}]},{name:"Metabolic and drug effects",teaches:"The ECG as a chemistry report.",cases:[{title:"Missed dialysis, weak",vignette:"70-year-old woman on haemodialysis, missed two sessions. Generalised weakness. K\u207A 7.1.",pathId:"hyperk_mod",options:["hyperk_mod","hyperk_mild","lqts","stemi_ant"],findings:["Tall, peaked, narrow, symmetric T waves","QRS beginning to widen","P waves flattening, PR lengthening","Changes are diffu <p>Only the part that stretches them generates pressure. That is the stressed volume, and the pressure it produces is the <em>mean systemic filling pressure</em>: what the whole circulation would settle at if the heart stopped. It is the upstream end of venous return, and everything the heart can pump has to come through it.</p>`},{kind:"predict",title:"Taking blood away",question:"We are about to remove 1000 mL \u2014 a 20% haemorrhage \u2014 with the baroreflex intact. What happens to the blood pressure?",options:[{id:"a",label:"It falls roughly in proportion, by about a fifth",correct:!1,why:"The circulation is not a passive tank. The reflex defends the pressure hard, and the fall is much less than proportional \u2014 which is exactly what makes early haemorrhage so easy to miss."},{id:"b",label:"It falls only slightly, because the reflex compensates",correct:!0,why:"Mean pressure holds up far better than cardiac output does. The reflex constricts arterioles to defend pressure, and constricts the veins to recruit unstressed volume into the stressed compartment \u2014 the body giving itself a transfusion. Output falls much further than pressure."},{id:"c",label:"It does not change at all",correct:!1,why:"Compensation is good, not perfect. Filling pressure has genuinely fallen and stroke volume falls with it."}],then:{params:{bloodVolume:4e3},settle:8},after:"Note how much further the cardiac output has fallen than the pressure. The reflex trades flow for pressure, which is why a normal blood pressure never excludes shock."},{kind:"predict",title:"What the reflex was worth",question:"Now switch the baroreflex off, leaving the same 4000 mL of blood. What happens?",options:[{id:"a",label:"Little change \u2014 the volume is what matters",correct:!1,why:"The volume sets the ceiling, but without venoconstriction most of that volume stays unstressed and cannot generate filling pressure at all."},{id:"b",label:"The pressure collapses",correct:!0,why:"Every defence goes at once: arteriolar tone, heart rate, contractility and \u2014 most importantly in a closed loop \u2014 venoconstriction. Losing the last one means the reservoir dilates and the stressed volume that was maintaining filling pressure drains back into unstressed capacity."}],then:{params:{bloodVolume:4e3},baro:!1,settle:8},after:"This is the difference between a compensated patient and a decompensated one, and it is the reason the same blood loss kills one person and barely troubles another."},{kind:"recap",points:["Preload is an outcome of the loop, not an input to it.","Mean systemic filling pressure is set by stressed volume over total compliance.","Venoconstriction converts unstressed volume into stressed volume \u2014 a transfusion from the body's own reservoir.","Compensation trades flow for pressure, so blood pressure is a late and unreliable sign of blood loss."]}]},{id:"right-heart",track:"The closed loop",title:"Two pumps in series",blurb:"Whatever the right ventricle fails to deliver, the left ventricle never receives.",minutes:7,focus:"wiggers",steps:[{kind:"do",title:"The forgotten ventricle",settings:{params:He,pathology:"normal",baro:!0},body:`The right ventricle moves exactly the same stroke volume as the left, against about a fifth of the pressure. So it is built thin, and it has very little reserve when the load rises suddenly.
<p>Because the two pumps are in series in a closed ring, they constrain each other completely. Whatever fails to cross the lungs cannot appear in the aorta, no matter how healthy the left ventricle is.</p>`},{kind:"predict",title:"A sudden load",question:"A large pulmonary embolism raises pulmonary vascular resistance sixfold. What happens to <em>left</em> atrial pressure?",options:[{id:"a",label:"It rises, because blood backs up",correct:!1,why:"Blood backs up behind the *right* ventricle, not the left. The obstruction is upstream of the left atrium, so less blood reaches it, not more."},{id:"b",label:"It falls, because less blood is getting through the lung",correct:!0,why:"This is the counterintuitive part and the thing worth taking away. The left side is underfilled, not congested. The patient is in shock with clear lung fields \u2014 and giving them a large fluid bolus will distend the failing right ventricle further and can make things worse."},{id:"c",label:"It is unchanged",correct:!1,why:"Output through the lung has fallen substantially, and left atrial filling falls with it."}],then:{params:{Rpul:.45},settle:8},after:"Pulmonary artery pressure is up, central venous pressure is up, and left atrial pressure is down. Three numbers, one lesion."},{kind:"predict",title:"The other right-sided failure",question:"Now instead of raising the load, we destroy the right ventricle itself \u2014 an RV infarct. Central venous pressure rises again. What separates this from the embolism?",options:[{id:"a",label:"Nothing \u2014 both are right heart failure",correct:!1,why:"They are both right heart failure, but from opposite directions, and one number tells them apart."},{id:"b",label:"Pulmonary artery pressure: high in embolism, low in infarct",correct:!0,why:"In embolism the ventricle is straining against a high load, so pulmonary pressure is high. In infarct the ventricle cannot generate pressure at all, so pulmonary pressure is low. Same raised venous pressure, same shock, opposite mechanism."},{id:"c",label:"Central venous pressure is normal in infarct",correct:!1,why:"A failing right ventricle backs blood up into the veins \u2014 venous pressure is raised in both."}],then:{params:{Rpul:.075,EmaxRv:.18},settle:8},after:"Both give a shocked patient with high venous pressure and clear lungs. The pulmonary artery pressure is the discriminator, and it is why the diagnosis is not made by examination alone."},{kind:"recap",points:["The right ventricle is a volume pump, not a pressure pump \u2014 it tolerates load badly.","PE: pulmonary pressure high, venous pressure high, left atrial pressure low.","RV infarct: pulmonary pressure low, venous pressure high, left atrial pressure low.","Raised venous pressure with clear lungs and shock is a right-sided problem until proven otherwise."]}]},{id:"valve-lesions",track:"Mechanics",title:"When ejection fraction lies",blurb:"A leaking mitral valve makes the number on the echo report improve while the patient deteriorates.",minutes:6,focus:"pvloop",steps:[{kind:"do",title:"A competent valve",settings:{params:He,pathology:"normal",baro:!0},body:`Ejection fraction is the fraction of end-diastolic volume the ventricle expels. It is popular because it is easy to measure and it usually tracks contractility.
<p>It assumes something that is not always true: that everything leaving the ventricle goes forward.</p>`},{kind:"predict",title:"A leaking mitral valve",question:"We make the mitral valve severely incompetent, so the ventricle can unload backwards into the atrium. What happens to the ejection fraction?",options:[{id:"a",label:"It falls \u2014 the heart is failing",correct:!1,why:"The patient is deteriorating, but the number does the opposite of what you expect."},{id:"b",label:"It rises, even though forward output falls",correct:!0,why:'The atrium is a low-pressure escape route, so emptying becomes easy and end-systolic volume falls further than normal. The fraction expelled goes up while the fraction that reaches the body goes down. A "normal" ejection fraction in severe mitral regurgitation already indicates significant ventricular impairment.'},{id:"c",label:"It stays the same",correct:!1,why:"Unloading conditions have changed substantially, so the fraction expelled changes too."}],then:{params:{regMitral:.8},settle:8},after:"Compare cardiac output with total stroke volume. The ventricle is shifting more blood than ever; less of it is going anywhere useful."},{kind:"do",title:"Stenosis is a different problem",settings:{params:{...He,Raortic:1.2},settle:8},body:`Now a stenotic aortic valve instead. The ventricle must generate a far higher pressure than the aorta ever sees \u2014 that difference is the gradient, and the pressure\u2013volume loop grows tall.
<p>Note where the disease is not. In mitral stenosis the ventricle is entirely normal and merely underfilled; the pressure is all in the atrium behind it, and from there it is transmitted straight to the lungs. Treating that patient's "heart failure" with drugs aimed at the ventricle treats the wrong chamber.</p>`},{kind:"recap",points:["Ejection fraction assumes all outflow is forward; regurgitation breaks that assumption.","In mitral regurgitation, EF overestimates function \u2014 a normal EF is already abnormal.","In stenosis, the ventricle generates pressure the arteries never see: the gradient.","In mitral stenosis the ventricle is innocent; the lesion is at the inlet and the pressure is behind it."]}]},{id:"valves",track:"Mechanics",title:"Why blood only goes one way",blurb:"Valves have no motor and no timing signal. They open and shut purely because pressure on one side beats pressure on the other.",minutes:5,focus:"wiggers",steps:[{kind:"do",title:"A single beat, laid out flat",settings:{params:He,pathology:"normal",baro:!0},body:`The stacked traces show one complete cardiac cycle. Three pressures are drawn on the same axis so you can see them cross:
<ul>
<li><em>Aortic</em> pressure, in carmine</li>
<li><em>Ventricular</em> pressure, in amber</li>
<li><em>Atrial</em> pressure, in teal</li>
</ul>
Below them are ventricular volume and the ECG. Drag anywhere on the strip to move the cursor \u2014 every other panel on the page follows it.`},{kind:"predict",title:"What opens the aortic valve?",question:"The aortic valve opens at one specific moment in the cycle. What actually causes it?",options:[{label:"A nerve signal timed to the QRS",why:"There is no nerve supply to the valve leaflets at all. Nothing tells them when to move."},{label:"Ventricular pressure rising above aortic pressure",correct:!0,why:"Exactly. The leaflets are passive flaps. The moment the amber trace crosses above the carmine one, they are pushed open."},{label:"The papillary muscles pulling them open",why:"Papillary muscles attach to the mitral and tricuspid valves, and they prevent prolapse rather than opening anything."},{label:"Ventricular volume reaching a threshold",why:"Volume is not sensed. A dilated failing ventricle can hold 250 mL and still not open the valve if its pressure stays low."}]},{kind:"say",title:"Find the crossing points",body:`Scrub the cursor slowly through systole and watch the amber and carmine traces. There are exactly two crossings per beat, and they are the two loudest events in the cycle.
<ul>
<li>Amber crosses <strong>above</strong> carmine \u2192 aortic valve opens, ejection starts</li>
<li>Amber falls <strong>below</strong> carmine \u2192 aortic valve shuts, and that closure is the <em>second heart sound</em></li>
</ul>
The same logic runs the mitral valve one axis down, between the amber and teal traces. <em>S1</em> is mitral closure at the start of systole.`},{kind:"say",title:"The two silent phases",body:`Between mitral closure and aortic opening, both valves are shut and the ventricle cannot change volume \u2014 it can only build pressure. That is <strong>isovolumic contraction</strong>, and on the volume trace it is perfectly flat.
<p>The mirror image happens after the aortic valve shuts: pressure collapses at constant volume until the mitral valve opens. That is <strong>isovolumic relaxation</strong>.</p>
<p>Look at the volume trace: it is flat, then falls steeply, then flat again, then refills. Those four segments are the whole cardiac cycle.</p>`},{kind:"recap",title:"What to carry away",body:`<ul>
<li>Valves are passive. Pressure gradients open and close them, nothing else.</li>
<li>Two crossings per beat produce the two heart sounds.</li>
<li>When both valves are shut, volume is fixed and only pressure can change.</li>
</ul>`}]},{id:"preload",track:"Mechanics",title:"Preload and the Frank\u2013Starling mechanism",blurb:"A ventricle that is filled more, empties more \u2014 without any change in contractility, and without being told to.",minutes:6,focus:"pv",steps:[{kind:"do",title:"Start from normal",settings:{params:He,pathology:"normal",baro:!1},body:`The baroreflex is switched off for this lesson so that heart rate stays fixed and you can see the mechanical effect on its own.
<p>Watch the <strong>pressure\u2013volume loop</strong>. It runs anticlockwise: filling along the bottom, isovolumic contraction up the right side, ejection across the top, isovolumic relaxation down the left. Its width is stroke volume.</p>`},{kind:"predict",title:"Commit before you look",question:"You raise the filling pressure from 7.5 to 14 mmHg and change nothing else. What happens to stroke volume?",options:[{label:"Rises",correct:!0,why:"Right. More filling stretches the myocytes, which increases the force each one generates. The loop gets wider."},{label:"Falls",why:"Falling stroke volume with rising filling pressure is the signature of a failing ventricle, not a normal one. We will produce exactly that later."},{label:"Unchanged \u2014 contractility did not change",why:"The common trap. Contractility is unchanged, but force still rises because the starting sarcomere length changed. That is the whole point of the mechanism."}],then:{params:{preload:14},settle:8},after:"Stroke volume climbed and the loop widened, with its right-hand edge pushed out to a larger end-diastolic volume. Contractility never moved \u2014 the <em>ESPVR line has the same slope</em>. The extra output came entirely from the extra stretch."},{kind:"say",title:"Why it matters that this is automatic",body:`The left and right ventricles pump in series, and nothing coordinates them beat to beat. If the right ventricle ejected even 1% more than the left, the lungs would flood within minutes.
<p>They stay matched because whichever ventricle receives more, ejects more. The Frank\u2013Starling mechanism is the feedback loop that keeps the two circulations balanced without any control system at all.</p>`},{kind:"predict",title:"The other direction",question:"Now drop filling pressure to 4 mmHg \u2014 the equivalent of significant blood loss. With the baroreflex still switched off, what happens to arterial pressure?",options:[{label:"Holds steady \u2014 the arteries buffer it",why:"Compliance smooths pressure within a beat, but it cannot manufacture volume. Over several beats the mean pressure must fall."},{label:"Falls substantially",correct:!0,why:"Correct, and this is why haemorrhage kills. Less filling \u2192 less stroke volume \u2192 less cardiac output \u2192 lower pressure."},{label:"Rises to compensate",why:"That would need the reflex, which is off. Compensation is a nervous response, not a mechanical one."}],then:{params:{preload:4},settle:8},after:"Pressure fell and the loop shrank from both directions. Now switch the baroreflex back on in the Loop workspace and watch the same bleed play out very differently \u2014 that is the next lesson."},{kind:"recap",title:"What to carry away",body:`<ul>
<li>More filling means more stretch, more force, and more stroke volume \u2014 with contractility unchanged.</li>
<li>On the PV loop, preload moves the right-hand edge without changing the ESPVR slope.</li>
<li>The mechanism is what keeps the two ventricles matched beat to beat.</li>
</ul>`}]},{id:"afterload",track:"Mechanics",title:"Afterload: the price of pushing",blurb:"Raise the pressure the ventricle has to eject against and it ejects less, immediately, with no change in its own strength.",minutes:6,focus:"pv",steps:[{kind:"do",title:"Reset, reflex off",settings:{params:He,pathology:"normal",baro:!1},body:"Back to baseline with the baroreflex off. Note the loop width and the end-systolic volume \u2014 the left-hand edge of the loop."},{kind:"predict",title:"Commit before you look",question:"Systemic vascular resistance doubles \u2014 a hypertensive crisis, or a hand squeezing the aorta. What happens to end-systolic volume?",options:[{label:"Falls \u2014 the ventricle works harder",why:"Effort does not equal emptying. The ventricle does generate more pressure, but it stops ejecting sooner."},{label:"Rises \u2014 more blood is left behind",correct:!0,why:"Right. Ejection stops earlier because pressure crosses back below aortic pressure sooner, so more blood stays in the chamber."},{label:"Unchanged \u2014 it is set by contractility",why:"End-systolic volume is set by where the ESPVR meets the load. Change the load and the meeting point moves along the line."}],then:{params:{R:2.2},settle:10},after:"The loop became taller and narrower. Its top-left corner slid <em>up and right along the ESPVR line</em> \u2014 the line itself did not move, because contractility did not change. More blood was left behind, so stroke volume fell."},{kind:"say",title:"The line the corner sits on",body:`The upper-left corner of every loop lands on the same straight line: the <strong>end-systolic pressure\u2013volume relation</strong>. It describes how hard the ventricle can squeeze at any given volume, and it is the cleanest available definition of contractility.
<p>Loading conditions move the corner <em>along</em> the line. Only a change in contractility rotates the line itself. That distinction is what makes the ESPVR worth knowing.</p>`},{kind:"predict",title:"A failing ventricle meets the same load",question:"We will now weaken the ventricle to half strength and then double resistance again. Compared with the healthy ventricle, how sensitive will its stroke volume be to that same rise in afterload?",options:[{label:"Much more sensitive",correct:!0,why:"Correct \u2014 and this is why afterload reduction is a cornerstone of heart failure treatment. A weak ventricle loses far more stroke volume for the same rise in load."},{label:"About the same",why:"The geometry says otherwise: a shallower ESPVR means the same vertical shift costs far more volume."},{label:"Less sensitive",why:"The opposite. A shallow ESPVR crosses the load line at a much more oblique angle."}],then:{params:{Emax:1.1,R:2.2},settle:10},after:"Stroke volume collapsed. The ESPVR is now a shallow line, so the same rise in pressure pushes the end-systolic point much further to the right. This is the argument for vasodilators, ACE inhibitors and afterload reduction in heart failure: you cannot easily make a failing ventricle stronger, but you can make its job smaller."},{kind:"recap",title:"What to carry away",body:`<ul>
<li>Higher afterload means ejection stops sooner, so end-systolic volume rises and stroke volume falls.</li>
<li>Load moves the corner along the ESPVR; contractility rotates the ESPVR itself.</li>
<li>The weaker the ventricle, the more afterload costs it.</li>
</ul>`}]},{id:"compliance",track:"Mechanics",title:"The aorta as a buffer",blurb:"Why a stiff aorta produces a wide pulse pressure, and why that is a cardiovascular risk factor rather than a curiosity.",minutes:5,focus:"wiggers",steps:[{kind:"do",title:"A young, elastic aorta",settings:{params:{...He,C:2.4},pathology:"normal",baro:!1},body:`Arterial compliance is set high, like a healthy twenty-year-old. The ventricle ejects in short bursts, but the aorta stretches to absorb each one and recoils during diastole to keep flow going.
<p>Read the systolic and diastolic numbers on the monitor strip, and note the pulse pressure \u2014 the gap between them.</p>`},{kind:"predict",title:"Commit before you look",question:"Now stiffen the aorta, as happens with age. Mean arterial pressure will barely move. What happens to systolic and diastolic pressure?",options:[{label:"Both rise together",why:"That would be a rise in mean pressure, which is set by cardiac output and resistance \u2014 neither of which we are changing."},{label:"Systolic rises, diastolic falls",correct:!0,why:"Right. The same stroke volume enters a less stretchy tube, so the peak overshoots; and with less stored recoil, pressure decays further before the next beat."},{label:"Both fall",why:"Nothing here reduces the volume being pumped or the resistance it meets."},{label:"Neither changes \u2014 compliance only affects the waveform shape",why:"Compliance is precisely what converts a pulsatile inflow into a steady outflow. Remove it and the pulse gets larger."}],then:{params:{C:.55},settle:8},after:"Pulse pressure widened dramatically while the mean barely moved. This is <strong>isolated systolic hypertension</strong>, the commonest pattern of raised blood pressure after about sixty, and it is a stiffness problem rather than a resistance problem."},{kind:"say",title:"Why the wide pulse hurts",body:`A high systolic peak increases the wall stress the ventricle must generate, driving hypertrophy. A low diastolic trough matters even more: the coronary arteries fill during <em>diastole</em>, so the perfusion pressure of the heart's own supply is the diastolic pressure.
<p>A stiff aorta therefore raises the heart's demand and lowers its supply at the same time. That is why pulse pressure predicts cardiovascular events independently of the mean.</p>`},{kind:"recap",title:"What to carry away",body:`<ul>
<li>Mean pressure is set by cardiac output and resistance. <em>Pulse</em> pressure is set by stroke volume and compliance.</li>
<li>Stiffening widens the pulse without moving the mean.</li>
<li>High systolic raises demand; low diastolic lowers coronary supply.</li>
</ul>`}]},{id:"baroreflex",track:"Control",title:"The baroreflex closes the loop",blurb:"The same haemorrhage, run twice: once with the reflex disabled and once with it intact.",minutes:6,focus:"baro",steps:[{kind:"do",title:"Open loop",settings:{params:He,pathology:"normal",baro:!1},body:`The baroreflex is off. Stretch receptors in the carotid sinus and aortic arch still fire in proportion to pressure, but nothing acts on that signal.
<p>The panel shows firing rate and the two autonomic outflows it drives.</p>`},{kind:"do",title:"Bleed the patient \u2014 reflex disabled",settings:{params:{preload:3.5},settle:10},body:"Filling pressure has been dropped sharply. Note how far mean arterial pressure falls, and note that heart rate does not move at all."},{kind:"predict",title:"Commit before you look",question:"We are about to switch the reflex on with the patient still hypovolaemic. Baroreceptor firing is low. What does the reflex do?",options:[{label:"Sympathetic up, parasympathetic down, heart rate rises",correct:!0,why:"Correct. Low firing means low pressure, and the response is more sympathetic drive and less vagal tone \u2014 so the rate climbs and cardiac output is partly defended."},{label:"Sympathetic down, heart rate falls",why:"That is the response to <em>high</em> pressure. The receptors fire faster when stretched, and more firing means more inhibition of sympathetic outflow."},{label:"Nothing \u2014 the reflex only responds to hypertension",why:"It is bidirectional, and the low-pressure arm is the one that keeps people conscious during haemorrhage."}],then:{baro:!0,settle:14},after:"Heart rate climbed and mean pressure was partly restored \u2014 not fully, because the reflex can only redistribute what remains. This is why a bleeding patient can look deceptively stable: tachycardia is doing the work, and the pressure only falls once that compensation is exhausted."},{kind:"say",title:"The sign of the loop",body:`The reflex is <strong>negative feedback</strong>, and every step inverts as you expect:
<p><code>pressure \u2191 \u2192 stretch \u2191 \u2192 firing \u2191 \u2192 sympathetic \u2193, vagal \u2191 \u2192 heart rate \u2193 \u2192 pressure \u2193</code></p>
<p>If you can reconstruct that chain, you can predict the effect of a carotid sinus massage, of a beta-blocker, and of the Valsalva manoeuvre without memorising any of them separately.</p>`},{kind:"recap",title:"What to carry away",body:`<ul>
<li>Baroreceptors report pressure by firing faster when stretched.</li>
<li>More firing inhibits sympathetic outflow and raises vagal tone.</li>
<li>Compensation buys time; it does not replace lost volume.</li>
</ul>`}]},{id:"failure",track:"Mechanics",title:"Two kinds of heart failure",blurb:"A ventricle that cannot squeeze and a ventricle that cannot relax both cause breathlessness, and the ejection fraction tells them apart.",minutes:7,focus:"pv",steps:[{kind:"do",title:"Normal reference",settings:{params:He,pathology:"normal",baro:!0},body:"Note the ejection fraction and the left atrial pressure. Both will move, but in different ways depending on which kind of failure we produce."},{kind:"do",title:"Failure of contraction",settings:{params:{Emax:.9},settle:14},body:`Contractility has been cut to roughly a third \u2014 a dilated cardiomyopathy, or the aftermath of a large infarct.
<p>The ESPVR has <em>rotated downward</em>. End-systolic volume is large, the chamber dilates, and ejection fraction collapses. This is <strong>heart failure with reduced ejection fraction</strong>.</p>`},{kind:"predict",title:"Commit before you look",question:"Now a different patient: contractility is completely normal, but the ventricle is stiff and resists filling. What will the ejection fraction be?",options:[{label:"Low, as in the previous case",why:"A stiff ventricle fills less, but it also empties proportionally \u2014 the fraction is preserved even though the absolute volumes are small."},{label:"Normal or even high",correct:!0,why:"Correct, and this is exactly why ejection fraction misleads here. Both end-diastolic and end-systolic volumes shrink, so their ratio survives."},{label:"Impossible to say without knowing the heart rate",why:"Rate changes filling time, but the ratio is dominated by the stiffness itself."}],then:{params:{Emax:2.7,edpB:.055,preload:15},settle:14},after:"Ejection fraction stayed near normal \u2014 but look at left atrial pressure. It is high, because the only way to fill a stiff ventricle is to push harder. That raised pressure backs up into the lungs, which is what makes the patient breathless. This is <strong>heart failure with preserved ejection fraction</strong>, and it accounts for roughly half of all heart failure."},{kind:"say",title:"Read the filling curve",body:`Compare the lower boundary of the PV loop with the dashed passive filling curve. In the stiff ventricle the curve is steep, so a small increase in volume costs a large increase in pressure.
<p>That single curve explains the whole syndrome: normal squeeze, normal fraction, high filling pressures, wet lungs.</p>`},{kind:"recap",title:"What to carry away",body:`<ul>
<li>Reduced ejection fraction is a failure of the ESPVR \u2014 the systolic line rotates down.</li>
<li>Preserved ejection fraction is a failure of the filling curve \u2014 the diastolic curve steepens.</li>
<li>Both raise atrial pressure and cause breathlessness. Ejection fraction separates them.</li>
</ul>`}]},{id:"potassium",track:"Conduction",title:"From potassium to the QRS",blurb:"The resting membrane potential is a potassium electrode, and the ECG reports it.",minutes:6,focus:"ecg",steps:[{kind:"do",title:"Normal potassium",settings:{params:{...He,K:4},pathology:"normal",baro:!0},body:"Serum potassium is 4.0 mmol/L. Watch lead II and the precordial leads on the ECG workspace \u2014 particularly the shape of the T wave."},{kind:"predict",title:"Commit before you look",question:"Serum potassium rises to 6.5. Which change appears first?",options:[{label:"The QRS widens",why:"That comes later. Widening reflects slowed conduction once the resting potential has drifted far enough to inactivate sodium channels."},{label:"Tall, peaked, narrow T waves",correct:!0,why:"Correct. Raised extracellular potassium speeds repolarisation, so the T wave becomes tall, narrow and symmetric \u2014 earlier than anything else."},{label:"The P wave disappears",why:"Atrial tissue is the most sensitive to potassium, but it flattens after the T waves peak, not before."},{label:"ST elevation appears",why:"ST elevation is an injury current pattern. Potassium acts through repolarisation instead."}],then:{params:{K:6.5},settle:8},after:"Peaked T waves, most obvious in V2 to V4. Nothing else has changed yet."},{kind:"do",title:"Push it further",settings:{params:{K:7.5},settle:8},body:"Now the P wave flattens and the PR interval stretches, because atrial tissue and the AV node are the most potassium-sensitive parts of the conducting system. The QRS is starting to widen."},{kind:"do",title:"Pre-arrest",settings:{params:{K:8.5},settle:8},body:`The P wave has gone and the QRS is so wide that it merges into the T wave \u2014 the <em>sine wave</em> pattern. This is minutes from arrest and is treated before the laboratory result is confirmed.
<p>Notice that the pump is failing too: with conduction this slow, coordinated contraction breaks down.</p>`},{kind:"say",title:"One ion, one sequence",body:`The whole progression follows from a single fact: raising extracellular potassium makes the resting membrane potential less negative.
<p>Less negative resting potential leaves fewer sodium channels available, so depolarisation slows and the QRS widens. Meanwhile potassium conductance rises, so repolarisation accelerates and the T wave peaks.</p>
<p>Peaked T \u2192 flat P \u2192 wide QRS \u2192 sine wave \u2192 arrest. One mechanism, one order, every time.</p>`},{kind:"recap",title:"What to carry away",body:`<ul>
<li>Peaked T waves come first and are the cheapest early warning available.</li>
<li>P wave flattening and PR prolongation follow.</li>
<li>QRS widening into a sine wave means treat now, ask questions later.</li>
</ul>`}]},{id:"blocks",track:"Conduction",title:"Breaking the wiring",blurb:"Slow the AV node, then cut a bundle branch, and watch which part of the trace deforms.",minutes:6,focus:"ecg",steps:[{kind:"do",title:"Intact conduction",settings:{params:He,pathology:"normal",baro:!0},body:`The conduction model runs a real excitable medium over a network from the sinus node to the Purkinje fibres. When you slow a segment, the delay it produces is computed rather than drawn.
<p>Note the narrow QRS: both bundle branches are firing together.</p>`},{kind:"do",title:"Slow the AV node",settings:{params:{avConduction:.35},settle:8},body:"AV conduction is down to 35%. The PR interval has lengthened \u2014 the atria still reach the ventricles, just late. The QRS is unchanged, because everything below the node is intact."},{kind:"predict",title:"Commit before you look",question:"Next we will block the left bundle branch completely. What happens to the QRS?",options:[{label:"It disappears",why:"The right bundle still works, so the ventricles are still activated \u2014 just not simultaneously."},{label:"It widens",correct:!0,why:"Correct. The left ventricle can now only be reached by slow muscle-to-muscle spread from the right side, which takes far longer than the Purkinje network."},{label:"It stays the same width but changes axis only",why:"Axis does shift, but the dominant change is duration \u2014 the two ventricles no longer depolarise together."},{label:"The PR interval lengthens instead",why:"PR is atrium-to-ventricle time, which is set above the bundles."}],then:{params:{avConduction:1,lbbConduction:.02},settle:8},after:"A wide QRS. This matters clinically for a specific reason: new left bundle branch block deforms the ST segment so badly that the usual criteria for reading an infarct no longer apply."},{kind:"say",title:"A rule worth keeping",body:`<ul>
<li>A long <strong>PR</strong> is a problem <em>above</em> the ventricles \u2014 at the AV node.</li>
<li>A wide <strong>QRS</strong> is a problem <em>within</em> the ventricles \u2014 bundle branches, myocardium, or potassium.</li>
</ul>
<p>Try the arrhythmia entries in the pathology list as well. A dropped beat with a lengthening PR is Wenckebach; P waves marching independently is complete block. Watch what each one does to blood pressure, not just to the trace.</p>`},{kind:"recap",title:"What to carry away",body:`<ul>
<li>PR interval reports the AV node; QRS duration reports the ventricles.</li>
<li>Bundle branch block widens the QRS because the two ventricles stop firing together.</li>
<li>New LBBB invalidates the usual ST criteria for infarction.</li>
</ul>`}]}];function ta(t,e,i,s){return(()=>{var n=["I","II","III","aVR","aVL","aVF","V1","V2","V3","V4","V5","V6"],o="0.1.0",r={sampleRateHz:500,highPassHz:.05,lowPassHz:150,gainMmPerMv:10,paperSpeedMmPerSec:25,baselineWander:0,muscleNoise:0,mainsNoise:0,motionArtifact:0,leadPlacementProfile:"standard",monitorMode:!1},c=class Yn{constructor(h){A(this,"state");this.state=d(h)}next(){let h=this.state+=1831565813;return h=Math.imul(h^h>>>15,h|1),h^=h+Math.imul(h^h>>>7,h|61),((h^h>>>14)>>>0)/4294967296}range(h,p){return h+this.next()*(p-h)}int(h,p){return Math.floor(this.range(h,p+1))}gaussian(h=0,p=1){let y=Math.max(1e-10,this.next()),b=this.next(),k=Math.sqrt(-2*Math.log(y))*Math.cos(2*Math.PI*b);return h+k*p}getState(){return this.state}setState(h){this.state=h>>>0}fork(h){let p=new Yn(this.state^d(h));return p.state=d(`${this.state}:${h}`),p}};function d(l){let h=String(l),p=2166136261;for(let y=0;y<h.length;y++)p^=h.charCodeAt(y),p=Math.imul(p,16777619);return p>>>0}function u(){let l=[m("sa","sa",833,["ra_high","ra_mid"]),m("ra_focus","atrial_focus",void 0,["ra_low"]),m("av_fast","av_fast",void 0,["la_post"]),m("av_slow","av_slow",void 0,["la_post"]),m("his","his",void 0,["septum_basal"]),m("lbb","bundle",void 0,["lbb_root"]),m("rbb","bundle",void 0,["rbb_root"]),m("laf","fascicle",void 0,["septum_mid"]),m("lpf","fascicle",void 0,["lv_inferior"]),m("lv_pkje","purkinje_root",void 0,["lv_anterolateral","lv_inferolateral","lv_apical"]),m("rv_pkje","purkinje_root",void 0,["rv_outflow","rv_free_basal","rv_free_apical"]),m("junctional","atrial_focus",1200,["septum_basal"]),m("vent_escape","ventricular_focus",1500,["lv_inferoseptal"])],h=[g("sa_ra","sa","ra_focus",15,"normal"),g("ra_avf","ra_focus","av_fast",60,"av_nodal",.85),g("ra_avs","ra_focus","av_slow",75,"av_nodal",.85),g("avf_his","av_fast","his",55,"av_nodal",.35,!1),g("avs_his","av_slow","his",80,"av_nodal",.35,!0),g("his_lbb","his","lbb",8,"his_purkinje"),g("his_rbb","his","rbb",8,"his_purkinje"),g("lbb_laf"," 2:7.2,HCO3:34,lactate:1.1,Na:139,Cl:96,albumin:38,K:4.2,urea:6,creat:88},options:[{id:"a",key:"A",label:"Acute-on-chronic respiratory acidosis with type 2 respiratory failure"},{id:"b",key:"B",label:"Acute respiratory acidosis alone"},{id:"c",key:"C",label:"Metabolic alkalosis with respiratory compensation"},{id:"d",key:"D",label:"Raised anion gap metabolic acidosis"}],answer:"a",diagnosis:"Acute-on-chronic type 2 respiratory failure",findings:["Acidaemic with a high PaCO\u2082 \u2014 the respiratory system is the primary problem","Bicarbonate 34 is far too high for an acute rise; renal retention takes days","PaO\u2082 7.2 with a raised PaCO\u2082 is type 2 respiratory failure","Anion gap 139 \u2212 (96 + 34) = 9, normal"],teaching:"The bicarbonate dates the illness. An acute rise in PaCO\u2082 of this size would lift bicarbonate by only about 3 mmol/L; 34 means the kidney has been compensating for a long time and something has now been added on top. The chronic part is the COPD, the acute part is the infection.",pitfall:"Give uncontrolled oxygen here and the PaCO\u2082 climbs further. Target saturations of 88\u201392%."},{id:"shock",vignette:"A 74-year-old is hypotensive after three days of diarrhoea. pH 7.22, PaCO\u2082 3.4 kPa, HCO\u2083\u207B 11, Na 141, Cl 115, albumin 32, lactate 5.8, urea 21, creatinine 190.",prompt:"What is going on metabolically?",labs:{pH:7.22,PaCO2:3.4,PaO2:12.5,HCO3:11,lactate:5.8,Na:141,Cl:115,albumin:32,K:3.1,urea:21,creat:190},options:[{id:"a",key:"A",label:"Mixed raised-gap and normal-gap metabolic acidosis"},{id:"b",key:"B",label:"Pure normal anion gap acidosis from diarrhoea"},{id:"c",key:"C",label:"Pure lactic acidosis"},{id:"d",key:"D",label:"Respiratory alkalosis"}],answer:"a",diagnosis:"Two acidoses at once \u2014 lactic acidosis on top of gastrointestinal bicarbonate loss",findings:["Anion gap 141 \u2212 (115 + 11) = 15; corrected for albumin 32 \u2192 17.5, raised","Delta ratio (17.5 \u2212 12) / (24 \u2212 11) = 0.42 \u2014 mic on examination. Na 121, urea 3.0, creatinine 62, glucose 4.8, serum osmolality 254, urine osmolality 480, urine sodium 55.",prompt:"What is the mechanism?",labs:{Na:121,K:4.1,Cl:88,urea:3,creat:62,glucose:4.8,albumin:36,pH:7.41,HCO3:24,PaCO2:5.2,lactate:1},options:[{id:"a",key:"A",label:"SIADH \u2014 inappropriately concentrated urine despite low serum osmolality"},{id:"b",key:"B",label:"Hypovolaemic hyponatraemia"},{id:"c",key:"C",label:"Primary polydipsia"},{id:"d",key:"D",label:"Cerebral salt wasting"}],answer:"a",diagnosis:"SIADH, likely paraneoplastic from a small cell lung carcinoma",findings:["True hypo-osmolar hyponatraemia \u2014 serum osmolality 254","Urine osmolality 480 is inappropriately concentrated when it should be maximally dilute","Urine sodium 55 with a low urea indicates euvolaemia, not depletion"],teaching:"The kidney should respond to a dilute plasma by producing maximally dilute urine. Concentrated urine in the face of low serum osmolality means ADH is acting when it should be switched off. In primary polydipsia the urine is appropriately dilute, which is how it is distinguished.",pitfall:"Cerebral salt wasting looks almost identical but the patient is volume-depleted \u2014 and the treatments are opposite. Fluid restriction in salt wasting makes things worse."}]}],yo=[{id:"gap",title:"The anion gap, and why you calculate it every time",blurb:"A normal pH can hide two opposing disturbances.",setup:{labs:{pH:7.4,PaCO2:5.3,HCO3:24,Na:140,Cl:104,albumin:42,lactate:1}},steps:[{kind:"say",eyebrow:"Start normal",text:"A completely normal gas. Sodium 140, chloride 104, bicarbonate 24 \u2014 the anion gap is 12, and the panel reports no disturbance. Nothing to see."},{kind:"predict",text:"Now the patient becomes septic and lactate rises to 8, consuming bicarbonate. But they are also vomiting, which loses acid and raises bicarbonate. Both happen at once and the pH lands back at 7.39. What will the anion gap show?",options:[{id:"a",label:"Normal, li
