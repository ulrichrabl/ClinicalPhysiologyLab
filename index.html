a root or a plexus. Testing a single muscle proves nothing; testing the right *pair* proves the level.",pitfall:"A C8 root lesion would weaken both, and would also give sensory loss extending up the medial forearm, beyond any single nerve."},{id:"footdrop",vignette:"A 61-year-old developed a right foot drop after a long illness in bed. Dorsiflexion 1/5, eversion 1/5, inversion 5/5, plantarflexion 5/5. Ankle jerk present. Sensation reduced over the dorsum of the foot only.",prompt:"Where is the lesion?",lesion:{syndrome:"peroneal-palsy",side:"R"},options:[{id:"a",key:"A",label:"Right common peroneal nerve at the fibular head"},{id:"b",key:"B",label:"Right L5 root"},{id:"c",key:"C",label:"Right sciatic nerve"},{id:"d",key:"D",label:"Right anterior horn cells"}],answer:"a",diagnosis:"Right common peroneal palsy at the fibular head \u2014 a compression neuropathy",findings:["Dorsiflexion and eversion weak: both peroneal","Inversion strong: tibialis posterior shares L5 but runs in the tibial nerve","Ankle jerk preserved and sensation limited to the peroneal territory"],teaching:"Foot drop is the commonest question in peripheral neurology and inversion is the answer to it. Tibialis posterior is the L5 muscle that is not peroneal, so it is weak in a radiculopathy and strong in a peroneal palsy. One muscle, two diagnoses.",pitfall:"The nerve is superficial at the fibular neck and is compressed by bed rest, plaster casts and crossed legs. Weight loss makes it far more likely."},{id:"mg",vignette:"A 32-year-old has drooping eyelids that are fine in the morning and unbearable by evening, and double vision when reading. After 60 seconds of upgaze the lids fall further. Voice becomes nasal while counting to 50. Reflexes are normal and sensation is entirely normal. There is no wasting.",prompt:"Where is the lesion?",lesion:{syndrome:"myasthenia",side:"L"},options:[{id:"a",key:"A",label:"Neuromuscular junction"},{id:"b",key:"B",label:"Muscle"},{id:"c",key:"C",label:"Brainstem"},{id:"d",key:"D",label:"Multiple cranial nerves"}],answer:"a",diagnosis:"Myasthenia gravis \u2014 postsynaptic acetylcholine receptor antibodies",findings:["Fatigable ptosis and diplopia with ocular and bulbar predilection","Completely normal sensation \u2014 no junction disorder can cause sensory loss","Reflexes preserved and no wasting","Fluctuation within a single day is the diagnostic feature"],teaching:'Two facts localise this without any test. There is no sensory loss, which excludes nerve and root; and the weakness varies within the day, which nothing structural does. Set the time course to "varies within the day" and the differential collapses to one answer.',pitfall:"A third nerve palsy is the trap \u2014 but it does not fatigue, and it does not spare the pupil while also weakening the voice."},{id:"myopathy",vignette:"A 58-year-old has struggled for two months to rise from a chair or wash her hair. She has no numbness and no tingling. Hip flexion and shoulder abduction are 3/5; grip and foot movements are 5/5. Reflexes are normal. Creatine kinase is markedly raised.",prompt:"Where is the lesion?",lesion:{syndrome:"myopathy",side:"L"},options:[{id:"a",key:"A",label:"Muscle"},{id:"b",key:"B",label:"Neuromuscular junction"},{id:"c",key:"C",label:"Peripheral nerve"},{id:"d",key:"D",label:"Anterior horn cell"}],answer:"a",diagnosis:"Inflammatory myopathy",findings:["Symmetric and proximal \u2014 the opposite of a length-dependent neuropathy","No sensory symptoms or signs at all","Reflexes preserved, which excludes significant denervation","Subacute over weeks: inflammatory rather than dystrophic"],teaching:"Distribution alone separates the last three rungs. Muscle disease is proximal and symmetric; neuropathy is distal and length-dependent; junction disease fatigues and takes the eyes and the voice. None of them causes sensory loss except neuropathy \u2014 so the sensory examination does most of the work.",pitfall:"Ask about statins, alcohol, steroids and thyroid before reaching for a biopsy. The commonest myopathies are the ones somebody prescribed."}]},{id:"crossed",name:"Crossed findings",cases:[{id:"wallenberg",vignette:"A 58-year-old smoker develops sudden vertigo, hoarseness and hiccups. Pinprick is dulled over the right side of the face and over the left arm and leg. The right pupil is small with a slightly droopy lid. Power is normal everywhere.",prompt:"Where is the lesion?",lesion:{syndrome:"wallenberg",side:"R"},options:[{id:"a",key:"A",label:"Right lateral medulla"},{id:"b",key:"B",label:"Left lateral medulla"},{id:"c",key:"C",label:"Right internal capsule"},{id:"d",key:"D",label:"Right pontine base"}],answer:"a",diagnosis:"Right lateral medullary (Wallenberg) syndrome \u2014 PICA territory",findings:["Face pain/temp lost on the right \u2014 the descending trigeminal tract has not crossed yet","Body pain/temp lost on the left \u2014 the spinothalamic tract crossed in the cord","Right Horner \u2014 the descending sympathetic fibres run in the lateral tegmentum","Hoarseness and reduced gag \u2014 nucleus ambiguus (IX, X) on the right"],teaching:"Normal power is the clue that stops you calling this a hemispheric stroke. The pyramid sits medially; a lateral medullary lesion misses it entirely. What it does catch is everything lateral \u2014 trigeminal, spinothalamic, sympathetic, ambiguus, and the inferior cerebellar peduncle.",pitfall:"Sensory loss on opposite sides of face and body is almost pathognomonic for a lateral brainstem lesion. Nothing above the pons can do it."},{id:"dejerine",vignette:"Sudden right-sided weakness of the arm and leg. The face is spared. The tongue deviates to the left on protrusion and looks wasted on that side. Vibration sense is reduced in the right foot.",prompt:"Where is the lesion?",lesion:{syndrome:"medial-medullary",side:"L"},options:[{id:"a",key:"A",label:"Left medial medulla"},{id:"b",key:"B",label:"Right medial medulla"},{id:"c",key:"C",label:"Left internal capsule"},{id:"d",key:"D",label:"Left lateral medulla"}],answer:"a",diagnosis:"Left medial medullary (D\xE9jerine) syndrome",findings:["Right hemiparesis sparing the face \u2014 pyramid, above the decussation","Tongue deviates left with wasting \u2014 left CN XII, a lower motor neuron","Right dorsal column loss \u2014 left nucleus gracilis/cuneatus, before the medial lemniscus crosses"],teaching:"Three medial structures, three findings: pyramid, medial lemniscus, hypoglossal nucleus. The tongue tells you the side of the lesion because it is the only LMN in the picture \u2014 a lower motor neuron always points at itself.",pitfall:"A capsular stroke would take the face too. Facial sparing pushes the lesion below the pons, where the corticobulbar fibres to VII have already left."},{id:"weber",vignette:"A 71-year-old wakes with a left-sided droopy eyelid, a dilated unreactive left pupil and the left eye resting down and out. The right arm and leg are weak with brisk reflexes and an upgoing toe.",prompt:"Where is the lesion?",lesion:{syndrome:"weber",side:"L"},options:[{id:"a",key:"A",label:"Left medial midbrain"},{id:"b",key:"B",label:"Right medial midbrain"},{id:"c",key:"C",label:"Left cavernous sinus"},{id:"d",key:"D",label:"Left internal capsule"}],answer:"a",diagnosis:"Left medial midbrain (Weber) syndrome",findings:["Left CN III palsy with a blown pupil \u2014 the nerve as it crosses the peduncle","Right UMN hemiparesis \u2014 the peduncle carries fibres that have not yet decussated"],teaching:"The rule that saves you in the brainstem: the cranial nerve localises the level and the side, the long tracts tell you it is a brainstem lesion at all. A third nerve palsy puts you in the midbrain; contralateral weakness puts you in the peduncle.",pitfall:"An isolated painful third nerve palsy with a dilated pupil and no long-tract signs is a compressive lesion \u2014 think posterior communicating aneurysm, not stroke."}]},{id:"face",name:"The facial nerve problem",cases:[{id:"bells",vignette:"A 34-year-old cannot close the right eye and cannot raise the right eyebrow. The right side of the mouth droops. Taste is altered on the front of the tongue. Limb power is normal.",prompt:"Where is the lesion?",lesion:{nodes:["R_cn7"]},options:[{id:"a",key:"A",label:"Right facial nerve (peripheral)"},{id:"b",key:"B",label:"Left motor cortex, face area"},{id:"c",key:"C",label:"Right internal capsule"},{id:"d",key:"D",label:"Left pontine corticobulbar fibres"}],answer:"a",diagnosis:"Right lower motor neuron facial palsy \u2014 Bell\u2019s palsy",findings:["Forehead involved \u2014 the giveaway for an LMN lesion","Incomplete eye closure with risk of exposure keratopathy","Altered taste \u2014 chorda tympani, so the lesion is at or above that branch point"],teaching:"The upper face receives corticobulbar input from *both* hemispheres; the lower face only from the opposite one. So a lesion anywhere above the nucleus spares the forehead, and a lesion at or below the nucleus does not. That single asymmetry is the most useful fact in cranial nerve examination.",pitfall:"Never reassure a facial palsy without checking eye closure. A cornea that cannot be covered is the actual emergency."},{id:"umn-face",vignette:"A 66-year-old hypertensive has a drooping right corner of the mouth and cannot show teeth on the right, but raises both eyebrows symmetrically and closes both eyes fully. The right arm is weak with a brisk biceps jerk.",prompt:"Where is the lesion?",lesion:{nodes:["L_ic"]},options:[{id:"a",key:"A",label:"Left internal capsule"},{id:"b",key:"B",label:"Right facial nerve"},{id:"c",key:"C",label:"Right internal capsule"},{id:"d",key:"D",label:"Left facial nucleus in the pons"}],answer:"a",diagnosis:"Left capsular lesion \u2014 UMN (central) facial weakness",findings:["Forehead spared, lower face weak \u2014 bilateral input above, crossed input below","Ipsilateral-to-face limb weakness on the same right side","Brisk reflexes confirm the lesion is above the anterior horn"],teaching:"Compare this with the previous case. Same drooping mouth, entirely different lesion \u2014 and the only reliable discriminator at the bedside is the forehead.",pitfall:"A pontine lesion at the facial nucleus produces an *LMN* facial palsy with contralateral limb weakness. Forehead involvement does not exclude a brainstem stroke; it just tells you where in the brainstem."}]},{id:"cord",name:"Spinal cord patterns",cases:[{id:"bs",vignette:"After a stab wound to the back, a young man has weakness of the left leg with brisk reflexes, loss of vibration and joint position sense in the left leg, and loss of pinprick and temperature in the right leg.",prompt:"Where is the lesion?",lesion:{syndrome:"brown-sequard",side:"L"},options:[{id:"a",key:"A",label:"Left hemicord"},{id:"b",key:"B",label:"Right hemicord"},{id:"c",key:"C",label:"Central cord"},{id:"d",key:"D",label:"Anterior cord"}],answer:"a",diagnosis:"Left cord hemisection \u2014 Brown-S\xE9quard",findings:["Left leg: UMN weakness (lateral corticospinal, already crossed in the medulla)","Left leg: vibration and position loss (dorsal column, crosses later in the medulla)","Right leg: pain and temperature loss (spinothalamic, crossed on entering the cord)"],teaching:"Two sensory systems, two crossing points, and the whole picture follows. Anything that crosses in the cord shows up contralaterally; anything that crosses in the medulla shows up ipsilaterally when the cord is damaged.",pitfall:"The dissociation is what matters, not the completeness. Partial hemicord lesions from compression give the same pattern in miniature."},{id:"central",vignette:"A 40-year-old describes a burning band across both shoulders and upper arms, with burns on the fingertips she did not feel happen. Vibration and joint position sense are normal. Legs are normal.",prompt:"Where is the lesion?",lesion:{syndrome:"central-cord",side:"L"},options:[{id:"a",key:"A",label:"Central cervical cord"},{id:"b",key:"B",label:"Bilateral dorsal columns"},{id:"c",key:"C",label:"Bilateral peripheral neuropathy"},{id:"d",key:"D",label:"Anterior spinal artery territory"}],answer:"a",diagnosis:"Central cervical cord lesion \u2014 syringomyelia",findings:["Cape-like bilateral loss of pain and temperature at C7\u2013C8","Dorsal columns spared \u2014 vibration and position intact","Painless burns: the classic presentation of dissociated sensory loss"],teaching:"The spinothalamic fibres cross right through the centre of the cord, so a cavity expanding from the middle picks them off segment by segment while the dorsal columns, sitting posteriorly, are untouched until much later.",pitfall:"Dissociated sensory loss in a suspended, non-dermatomal distribution is a cord sign, not a nerve sign. A peripheral neuropathy would be distal and symmetric."},{id:"neurogenic",vignette:"A 24-year-old is brought in after a diving accident with no movement below the shoulders. Blood pressure is 76/44 and the heart rate is 48. The skin is warm and dry. There is no external blood loss.",prompt:"Why is he hypotensive?",lesion:{nodes:["L_cst_C5","R_cst_C5","L_ahn_C5","R_ahn_C5"]},options:[{id:"a",key:"A",label:"Neurogenic shock from loss of sympathetic outflow"},{id:"b",key:"B",label:"Occult haemorrhage"},{id:"c",key:"C",label:"Cardiogenic shock from myocardial contusion"},{id:"d",key:"D",label:"Tension pneumothorax"}],answer:"a",diagnosis:"Neurogenic shock \u2014 high cervical cord injury",findings:["Hypotension with bradycardia \u2014 sympathetic outflow to vessels and heart is disconnected","Warm, dry, well-perfused skin \u2014 no compensatory vasoconstriction is possible","Cardiac accelerator fibres leave the cord at T1\u2013T4, below the lesion"],teaching:"This is the case that will not resolve inside one specialty. Haemorrhagic shock gives you a fast, thready pulse and cold clamped peripheries because the sympathetic system is intact and working hard. Cut that system out of the loop and the same low pressure comes with a slow pulse and warm skin. Open the cardiovascular workspace with this lesion in place and you can watch the pressure-volume loop change.",pitfall:"Assuming bradycardia excludes shock. Here it is the diagnostic feature. But you still have to exclude bleeding \u2014 a trauma patient is allowed two problems."}]},{id:"visual",name:"Visual fields and pupils",cases:[{id:"chiasm",vignette:"A 46-year-old keeps bumping into door frames on both sides. Confrontation testing shows loss of both temporal fields. Acuity and pupils are normal. She has noticed her wedding ring no longer fits.",prompt:"Where is the lesion?",lesion:{syndrome:"chiasm",side:"L"},options:[{id:"a",key:"A",label:"Optic chiasm"},{id:"b",key:"B",label:"Left optic nerve"},{id:"c",key:"C",label:"Right occipital cortex"},{id:"d",key:"D",label:"Both optic radiations"}],answer:"a",diagnosis:"Chiasmal compression \u2014 pituitary macroadenoma",findings:["Bitemporal hemianopia respecting the vertical meridian","Only nasal retinal fibres cross, and they carry the temporal fields","Ring no longer fitting suggests acromegaly \u2014 a secreting adenoma"],teaching:"The chiasm is the one place in the nervous system where a single midline lesion produces a bilateral deficit that is nonetheless not symmetric in origin \u2014 it takes the crossing fibres from both eyes.",pitfall:"A field defect that respects the vertical meridian is retrochiasmal or chiasmal. One that respects the horizontal meridian is retinal or vascular."},{id:"rapd",vignette:"A 28-year-old had painful loss of vision in the left eye a week ago, now partly recovered. On the swinging flashlight test, both pupils constrict when the light is on the right eye, but the left pupil dilates when the light swings to it.",prompt:"Where is the lesion?",lesion:{nodes:["L_cn2"]},options:[{id:"a",key:"A",label:"Left optic nerve \u2014 afferent defect"},{id:"b",key:"B",label:"Left oculomotor nerve \u2014 efferent defect"},{id:"c",key:"C",label:"Left Edinger-Westphal nucleus"},{id:"d",key:"D",label:"Left sympathetic chain"}],answer:"a",diagnosis:"Left relative afferent pupillary defect \u2014 optic neuritis",findings:["Both pupils respond normally to light in the good eye \u2014 the efferent limb is intact","Less light signal gets in through the affected nerve, so the pupils redilate","Painful monocular loss in a young adult: think demyelination"],teaching:"An afferent defect never gives you anisocoria at rest \u2014 both pupils always match, because the efferent signal is shared. If the pupils are unequal in ambient light, the problem is efferent or sympathetic instead.",pitfall:"Do not call this a third nerve palsy. There is no ptosis, no ophthalmoplegia, and the pupil constricts perfectly well when the *other* eye is lit."}]}],Fo=[{id:"ladder",title:"The last four rungs",blurb:"Root, plexus, nerve, junction, muscle \u2014 and the single test that separates each pair.",setup:{syndrome:"ulnar-elbow",side:"L",filter:"motor"},steps:[{kind:"say",eyebrow:"Nerve",text:"A left ulnar neuropathy at the elbow. Look at the findings: the first dorsal interosseous is weak and wasted, and the abductor pollicis brevis is normal. Both are C8 and T1 muscles. They differ only in which nerve carries them."},{kind:"predict",text:"Now move the lesion up to the C8 anterior horn \u2014 the root rather than the nerve. What happens to thumb abduction?",options:[{id:"a",label:"Still normal \u2014 it is a median muscle",correct:!1,why:"The median nerve is spared, but the root that feeds it is not. Above the point where the nerves separate, everything sharing the root goes together."},{id:"b",label:"Now weak as well, because it shares the root",correct:!0,why:"That is the whole test. Two muscles with the same roots and different nerves are weak together in a root lesion and dissociate in a nerve lesion. Pick the pair deliberately and one examination answers the question."}],then:{nodes:["L_ahn_C8"],complete:!0},after:"Sensory loss follows the same logic: dermatomal for a root, and sharply confined to one nerve's territory for a nerve."},{kind:"do",eyebrow:"Plexus",text:"The upper trunk of the brachial plexus. Weakness now crosses the axillary, musculocutaneous and radial nerves, but stays in one arm \u2014 a pattern no single nerve and no single root can produce.",settings:{syndrome:"upper-trunk",side:"L"},cta:"Now the junction \u2192"},{kind:"predict",text:"Next, the neuromuscular junction. Before you look \u2014 what happens to the *sensory* examination?",options:[{id:"a",label:"Sensory loss in the weak muscles",correct:!1,why:"The junction is purely motor. There is no sensory apparatus there to damage."},{id:"b",label:"Completely normal sensation",correct:!0,why:"This is the most useful single fact about junction and muscle disease. Weakness with entirely normal sensation puts the lesion at the junction, in the muscle, or in the anterior horn \u2014 and nowhere else."}],then:{syndrome:"myasthenia",side:"L",filter:"all"},after:"Note the ocular and bulbar predilection, the preserved reflexes, and that the weakness is fatigable rather than fixed."},{kind:"do",eyebrow:"Muscle",text:"Finally the muscle itself: symmetric, proximal, no sensory loss, reflexes preserved. Junction disease fatigues and takes the eyes; muscle disease does neither.",settings:{syndrome:"myopathy",side:"L"},cta:"What to take away"},{kind:"recap",points:["Root: myotome and dermatome, reflex lost, muscles of different nerves weak together.","Plexus: several nerves, one limb, sensory loss fitting neither nerve nor dermatome.","Nerve: that nerve only \u2014 the dissociation from its neighbours is the diagnosis.","Junction: fatigable, ocular and bulbar, reflexes and sensation normal.","Muscle: proximal, symmetric, sensation normal, reflexes preserved until late."]}]},{id:"tempo",title:"Where is only half the question",blurb:"Identical findings, four different diseases. Only the history separates them.",setup:{nodes:["L_ic"],complete:!0,tempo:"hyperacute"},steps:[{kind:"say",eyebrow:"One lesion",text:"A left internal capsule lesion: right hemiparesis with facial involvement, brisk reflexes, an upgoing toe. Look at the time course panel \u2014 set to seconds-to-minutes, the differential is stroke or haemorrhage."},{kind:"predict",text:"The examination findings do not change at all. The history changes: the weakness came on over eight weeks and is still progressing. What should you do with the differential?",options:[{id:"a",label:"Nothing \u2014 the localisation is what matters",correct:!1,why:"Localisation tells you where to image. It tells you almost nothing about what you will find there, and nothing at all about how urgently."},{id:"b",label:"Replace it \u2014 this is now a mass lesion until proven otherwise",correct:!0,why:"Identical signs, an entirely different list. Nothing vascular progresses over eight weeks. Set the tempo to days-to-weeks and read the panel: tumour, abscess, demyelination, subdural."}],then:{nodes:["L_ic"],complete:!0,tempo:"subacute"},after:"This is why the history is taken before the examination and not after it. The exam localises; only the history dates."},{kind:"do",eyebrow:"The tempo that is itself a diagnosis",text:"Now a junction lesion with a fluctuating course. Some tempos are diagnostic on their own: weakness that is fine in the morning and gone by evening is myasthenia, and no imaging will show it.",settings:{syndrome:"myasthenia",side:"L",tempo:"fluctuating"},cta:"What to take away"},{kind:"recap",points:["Localisation and tempo are independent axes; the differential needs both.","Hyperacute is vascular. Subacute is inflammatory, infiltrative or compressive. Chronic is degenerative or hereditary.","Relapsing means separated in time \u2014 the second half of the multiple sclerosis definition.","Fluctuating within a day points at the neuromuscular junction and nowhere else."]}]},{id:"forehead",title:"Why the forehead is spared",blurb:"The single asymmetry that separates a stroke from a Bell\u2019s palsy.",setup:{nodes:["R_cn7"],complete:!0,filter:"cranial"},steps:[{kind:"say",eyebrow:"Setup",text:"The lesion is on the right facial nerve, distal to the nucleus \u2014 a peripheral palsy. Look at the findings panel: both the upper and the lower face on the right are weak."},{kind:"predict",text:"Now move the lesion up into the corticobulbar fibres, in the left internal capsule. What happens to the upper face?",options:[{id:"a",label:"Upper face becomes weak on the left instead",correct:!1,why:"The pathway does cross, but that is not what happens to the forehead. The upper face has a second, uncrossed source of input."},{id:"b",label:"Upper face is spared; only the lower face is weak",correct:!0,why:"The upper facial nucleus receives corticobulbar fibres from both hemispheres. Losing one leaves the other, so the forehead still works. The lower face is supplied only by the crossed pathway and has no backup."},{id:"c",label:"Both upper and lower face stay normal",correct:!1,why:"The lower face depends entirely on crossed input from one hemisphere, so it does become weak."}],then:{nodes:["L_ic"],complete:!0},after:"Three pathways in the model reach the right facial nucleus: one from the left cortex to the lower face, and one from *each* cortex to the upper face. Lesioning the left capsule hits two of the three, and the surviving right-cortex pathway keeps the forehead going."},{kind:"recap",points:["LMN facial palsy involves the forehead; UMN facial weakness spares it.","The reason is redundancy, not crossing \u2014 the upper face has bilateral cortical input.","A pontine lesion at the nucleus itself gives an LMN pattern with crossed limb signs."]}]},{id:"two-systems",title:"Two sensory systems, two crossings",blurb:"Build Brown-S\xE9quard from first principles instead of memorising it.",setup:{nodes:["L_dc_asc"],complete:!0,filter:"sensory"},steps:[{kind:"say",eyebrow:"Dorsal column",text:"This lesion sits in the left dorsal column in the thoracic cord. The findings show loss of vibration and joint position sense on the left \u2014 the same side. These fibres ascend without crossing and only decussate in the medulla, above the lesion."},{kind:"predict",text:"Move to the left anterolateral (spinothalamic) tract at the same level. Which side loses pinprick?",options:[{id:"a",label:"The left \u2014 same side as the lesion",correct:!1,why:"These fibres crossed within a segment or two of entering the cord, so the ones ascending on the left originally came from the right."},{id:"b",label:"The right \u2014 the opposite side",correct:!0,why:"Pain and temperature fibres synapse and cross almost immediately on entering the cord. By the time they are ascending in the left anterolateral tract they carry information from the right side of the body."},{id:"c",label:"Both sides equally",correct:!1,why:"The crossing is complete, not partial \u2014 one tract carries one side."}],then:{nodes:["L_stt_asc"],complete:!0},after:"Now put the two together: one hemicord lesion, ipsilateral position sense loss, contralateral pain loss. That is Brown-S\xE9quard, and you have just derived it."},{kind:"do",eyebrow:"The whole syndrome",text:"Here is the full left hemisection \u2014 motor, dorsal column and spinothalamic together.",settings:{syndrome:"brown-sequard",side:"L",filter:"all"},cta:"Look at the findings \u2192"},{kind:"recap",points:["Spinothalamic crosses in the cord; dorsal column crosses in the medulla.","A cord lesion therefore splits the two modalities to opposite sides.","Motor follows the dorsal column side, because the corticospinal tract crossed in the medulla too."]}]},{id:"brainstem-rule",title:"The brainstem rule",blurb:"Cranial nerves give the level; long tracts give the side.",setup:{syndrome:"weber",side:"L",filter:"all"},steps:[{kind:"say",eyebrow:"Midbrain",text:"A left medial midbrain lesion. The findings show a left third nerve palsy and right-sided weakness. The cranial nerve is ipsilateral because it has already left the brainstem; the limb weakness is contralateral because the pyramid has not yet decussated."},{kind:"predict",text:"Move the lesion down to the left medial medulla. The pyramid is still there, so the limbs stay weak on the right. Which cranial nerve replaces the third?",options:[{id:"a",label:"CN VII \u2014 facial",correct:!1,why:"The facial nucleus is pontine. Below the pons its fibres have already left."},{id:"b",label:"CN XII \u2014 hypoglossal",correct:!0,why:"The hypoglossal nucleus is the medial medullary cranial nerve. The tongue deviates toward the weak side, pointing at the lesion, because it is a lower motor neuron."},{id:"c",label:"CN VI \u2014 abducens",correct:!1,why:"Abducens is pontine, sitting at the pontomedullary junction \u2014 one level up."}],then:{syndrome:"medial-medullary",side:"L"},after:"Three medial structures at every brainstem level: the motor pathway, the medial lemniscus, and the motor cranial nerve of that level. Learn the nerve and you have the level."},{kind:"recap",points:["Midbrain \u2192 III. Pons \u2192 VI, VII. Medulla \u2192 XII (medial) and IX, X (lateral).","Ipsilateral cranial nerve plus contralateral limbs means brainstem, every time.","Medial lesions take the pyramid and medial lemniscus; lateral lesions take spinothalamic, trigeminal and sympathetic."]}]},{id:"cross-domain",title:"A cord lesion is a cardiac problem",blurb:"Where neurology stops being neurology.",setup:{nodes:["L_ahn_L3"],complete:!0,filter:"motor"},steps:[{kind:"say",eyebrow:"Start low",text:"A lesion at the left L3 anterior horn \u2014 an isolated lower motor neuron problem. Weak knee extension, absent patellar reflex, no reflexes elsewhere. The patient is haemodynamically completely normal; check the vitals strip."},{kind:"predict",text:"Now move the lesion to the cervical cord at C5, bilaterally. Besides quadriparesis, what happens to the blood pressure and heart rate?",options:[{id:"a",label:"Nothing \u2014 the cord does not control the circulat cal change and PR-segment shifts.","Recognise benign early repolarisation and the features that argue against infarction.","Identify the Wellens pattern as a marker of critical proximal LAD stenosis, and act on it.","Recognise posterior infarction and the very-high-risk NSTE-ACS patient who needs immediate angiography."],activities:[{ref:"cardio/case/stemi_ant"},{ref:"cardio/case/pericarditis"},{ref:"cardio/case/early_repol"},{ref:"cardio/case/wellens"},{ref:"cardio/case/nstemi"}],questions:[Y("st1a",0,"a","A 61-year-old man has 90 minutes of central chest pain. The ECG shows 3 mm ST elevation in II, III and aVF with 1.5 mm ST depression in I and aVL. What is the most likely diagnosis?",["Acute inferior STEMI","Acute pericarditis","Benign early repolarisation","Old inferior infarction with aneurysm"],"a","Regional elevation confined to one territory with reciprocal depression on the opposite side (aVL is the mirror of III) is infarction until proven otherwise. Pericarditis does not respect a coronary territory and has no reciprocal ST depression outside aVR and V1."),Y("st1b",0,"b","A 28-year-old woman has sharp chest pain that eases when she sits forward. The ECG shows concave ST elevation across I, II, aVL, aVF and V2\u2013V6. Which additional finding most strongly favours pericarditis over STEMI?",["PR-segment depression with PR elevation in aVR, and no reciprocal ST depression elsewhere","ST elevation in two contiguous leads","T-wave inversion developing while the ST segments are still elevated","New Q waves in the inferior leads"],"a","PR depression reflects atrial injury, and diffuse elevation without reciprocal change is the pericardial pattern. T inversion while ST is still elevated and new Q waves both point towards infarction; in pericarditis the T waves usually invert only after the ST segments return to baseline."),Y("st2a",1,"a","Which feature favours benign early repolarisation over anterior STEMI?",["Concave ST elevation with J-point notching that is unchanged on serial ECGs",'Convex ("tombstone") ST elevation with loss of R-wave height',"Reciprocal ST depression in the inferior leads","ST elevation that increases between two ECGs 20 minutes apart"],"a","Early repolarisation is concave, often notched at the J point, stable over time and has no reciprocal change. Evolution between serial tracings, convexity, loss of R wave and reciprocal depression all suggest infarction."),Y("st2b",1,"b","An asymptomatic 20-year-old footballer has 1.5 mm concave ST elevation in V2\u2013V4 with J-point notching on a screening ECG. What is the most appropriate next step?",["Compare with any previous ECG and assess clinically; no emergency treatment if he is well and the trace is stable","Activate the catheter laboratory","Start aspirin and colchicine for pericarditis","Give thrombolysis if angiography is not available"],"a","In a young, asymptomatic athlete this pattern is common and benign. The decision rests on the clinical picture and stability, not the ST segment alone. Reperfusion therapy for a non-infarct is a serious harm."),Y("st3a",2,"a","A 55-year-old man had chest pain yesterday and is now pain-free. The ECG shows deep, symmetrical T-wave inversion in V2\u2013V3 with preserved R waves and no Q waves. Which management is most appropriate?",["Avoid exercise stress testing and arrange early invasive coronary angiography","Exercise treadmill test to provoke ischaemia","Discharge with outpatient follow-up because he is pain-free","Immediate thrombolysis"],"a","This is the Wellens pattern, a marker of critical proximal LAD stenosis. Stress testing can precipitate an extensive anterior infarction. The pattern appears in the pain-free interval, which is exactly why it is missed."),Y("st3b",2,"b","The Wellens pattern (biphasic or deeply inverted T waves in V2\u2013V3 after an episode of chest pain) points to a critical stenosis in which artery?",["Proximal left anterior descending artery","Right coronary artery","Left circumflex artery","Posterior descending artery"],"a","Wellens and colleagues described the pattern in patients with high-grade proximal LAD stenosis; many went on to anterior infarction within weeks if untreated."),Y("st4a",3,"a","A 70-year-old woman has ongoing chest pain. The ECG shows 2 mm horizontal ST depression in V1\u2013V3 with a dominant R wave in V2 and upright T waves. What should you do next?",["Record posterior leads V7\u2013V9 and treat as STEMI if they show ST elevation","Treat as NSTEMI with angiography within 72 hours","Diagnose right bundle branch block","Attribute it to digoxin effect"],"a","Isolated ST depression in V1\u2013V3 can be the mirror image of posterior infarction. ESC guidance treats posterior STEMI as a STEMI equivalent. The posterior leads make it visible."),Y("st4b",3,"b","In suspected NSTE-ACS, which situation calls for an immediate invasive strategy (angiography within 2 hours) under the 2023 ESC guidelines?",["Ongoing chest pain refractory to medical treatment, or haemodynamic instability","A single troponin above the 99th percentile in a pain-free patient","Age over 75 years alone","Diabetes with normal troponins"],"a","Very-high-risk features include haemodynamic instability or cardiogenic shock, recurrent or refractory pain despite medical treatment, life-threatening arrhythmias, mechanical complications and acute heart failure clearly related to ACS. A confirmed NSTEMI diagnosis alone places a patient in the high-risk group (early invasive, within 24 hours).")],references:["Byrne RA, Rossello X, Coughlan JJ, et al. 2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J. 2023;44(38):3720\u20133826.","Thygesen K, Alpert JS, Jaffe AS, et al. Fourth universal definition of myocardial infarction (2018). Eur Heart J. 2019;40(3):237\u2013269.","Schulz-Menger J, Collini V, Gr\xF6schel J, et al. 2025 ESC Guidelines for the management of myocarditis and pericarditis. Eur Heart J. 2025;46(40):3952\u20134041.","de Zwaan C, B\xE4r FW, Wellens HJJ. Characteristic electrocardiographic pattern indicating a critical stenosis high in left anterior descending coronary artery in patients admitted because of impending myocardial infarction. Am Heart J. 1982;103(4 Pt 2):730\u2013736."],review:Mt,accreditation:null},{id:"wide-and-slow",title:"Wide complexes and slow hearts",blurb:"Regular broad-complex tachycardia, pre-excitation, and where in the conduction system a block sits.",levels:["student","resident","physician"],specialty:"Cardiology \xB7 Emergency \xB7 Acute medicine",minutes:45,maxHours:.75,passMark:.75,accent:"lv",objectives:["Treat regular broad-complex tachycardia as VT until proven otherwise, and name the features that confirm it.","Recognise pre-excitation and the danger of AV-nodal blockade in pre-excited atrial fibrillation.","Localise second-degree AV block to the node or below it, and predict the consequences.","Recognise complete heart block and judge the reliability of its escape rhythm."],activities:[{ref:"cardio/case/vt"},{ref:"cardio/case/lbbb"},{ref:"cardio/case/wpw_a"},{ref:"cardio/case/wenckebach"},{ref:"cardio/case/chb"},{ref:"cardio/lesson/blocks"}],questions:[Y("ws1a",0,"a","A 67-year-old man with a previous anterior infarct has a regular broad-complex tachycardia at 170/min. His blood pressure is 118/76 mmHg and he is alert. Which finding most strongly supports ventricular tachycardia?",["AV dissociation with capture or fusion beats","A rate above 150/min","Right bundle branch block morphology","His stable blood pressure"],"a","AV dissociation, and the capture and fusion beats it produces, is close to diagnostic of VT. Haemodynamic stability does not argue against VT; many patients with VT are initially well. A history of structural heart disease makes VT the most likely diagnosis."),Y("ws1b",0,"b","In a regular broad-complex tachycardia of uncertain mechanism, which action carries the greatest risk?",["Intravenous verapamil","Synchronised DC cardioversion under sedation","Recording a 12-lead ECG before treatment","Intravenous amiodarone"],"a","Verapamil given for presumed SVT with aberrancy can cause profound hypotension and cardiac arrest if the rhythm is VT. When in doubt, treat as VT."),Y("ws2a",1,"a","A 24-year-old has palpitations. In sinus rhythm the PR interval is 100 ms, the QRS is 125 ms with a slurred upstroke, and there are secondary ST\u2013T changes. What is the diagnosis?",["Wolff\u2013Parkinson\u2013White pattern (ventricular pre-excitation)","Left bundle branch block","Hyperkalaemia","Brugada pattern"],"a","A short PR interval, a delta wave and a broad QRS reflect early activation of the ventricle through an accessory pathway that bypasses the AV node."),Y("ws2b",1,"b","A 30-year-old with known pre-excitation has an irregular broad-complex tachycardia at up to 250/min, with QRS width varying from beat to beat. Which treatment should be avoided?",["AV-nodal blocking drugs such as adenosine, verapamil or digoxin","Synchronised cardioversion if he becomes unstable","Intravenous procainamide or ibutilide if he is stable","Expert referral for catheter ablation"],"a","This is pre-excited atrial fibrillation. Blocking the AV node leaves the accessory pathway as the only route and can accelerate conduction into ventricular fibrillation."),Y("ws3a",2,"a","The PR interval lengthens progressively until a P wave is not conducted, then the cycle repeats. The QRS is narrow. Where is the block?",["The AV node","Below the His bundle","The sinoatrial node","Both bundle branches"],"a","Wenckebach periodicity with a narrow QRS is almost always nodal. It is often vagal, frequently benign, and usually responds to atropine."),Y("ws3b",2,"b","Mobitz type II block with right bundle branch block is found in a patient with syncope. Why is pacing indicated?",["The block is infranodal and may progress suddenly to complete heart block with an unreliable escape rhythm","It is usually vagal and resolves with atropine","It indicates digoxin toxicity","The PR interval is too long for safe conduction"],"a","Constant PR intervals with dropped beats, especially alongside bundle branch disease, place the block in the His\u2013Purkinje system. Atropine speeds the sinus rate but does not help, and may worsen, infranodal block."),Y("ws4a",3,"a","Which finding defines complete (third-degree) heart block?",["P waves and QRS complexes are independent, with the atrial rate faster than the ventricular rate","Every second P wave is not conducted","The PR interval is longer than 300 ms","An occasional non-conducted P wave"],"a","In complete heart block no atrial impulse reaches the ventricles. The atria and ventricles each keep their own rhythm, so the PR intervals vary at random."),Y("ws4b",3,"b","In complete heart block the escape rhythm is broad at 32/min. What does this imply?",["A ventricular escape focus, which is slow and unreliable, so pacing is urgent","A junctional escape, which is usually stable","That the block is at the AV node","That atropine will reliably restore conduction"],"a","Narrow escape rhythms at 40\u201360/min usually arise from the junction. Broad, slow escapes originate lower down, are prone to pauses and asystole, and signal infranodal disease.")],references:["Zeppenfeld K, Tfelt-Hansen J, de Riva M, et al. 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death. Eur Heart J. 2022;43(40):3997\u20134126.","Glikson M, Nielsen JC, Kronborg MB, et al. 2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy. Eur Heart J. 2021;42(35):3427\u20133520.","Kusumoto FM, Schoenfeld MH, Barrett C, et al. 2018 ACC/AHA/HRS guideline on the evaluation and management of patients with bradycardia and cardiac conduction delay. Circulation. 2019;140(8):e382\u2013e482.","Brugada P, Brugada J, Mont L, Smeets J, Andries EW. A new approach to the differential diagnosis of a regular tachycardia with a wide QRS complex. Circulation. 1991;83(5):1649\u20131659."],review:Mt,accreditation:null},{id:"chemistry-ecg",title:"Acid\u2013base, potassium and the ECG",blurb:"The blood gas worked one step at a time, and the ECG read as a chemistry report.",levels:["student","resident","physician"],specialty:"Acute medicine \xB7 Nephrology \xB7 Intensive care",minutes:50,maxHours:.75,passMark:.75,accent:"la",objectives:["Recognise the ECG progression of hyperkalaemia and give membrane stabilisation first.","Interpret a metabolic acidosis systematically: expected compensation and the albumin-corrected anion gap.","Detect mixed acid\u2013base disorders using expected compensation and the delta ratio.","Distinguish digoxin effect from digoxin toxicity and know what potentiates toxicity."],activities:[{ref:"cardio/case/hyperk_mod"},{ref:"cardio/case/digitalis"},{ref:"cardio/lesson/potassium"},{ref:"labs/case/dka"},{ref:"labs/case/copd"},{ref:"labs/case/shock"},{ref:"labs/lesson/gap"}],questions:[Y("ch1a",0,"a","A dialysis patient who missed two sessions has K\u207A 7.4 mmol/L, peaked T waves, absent P waves and a QRS of 140 ms. What should be given first?",["Intravenous calcium (gluconate or chloride)","Insulin with glucose","Intravenous sodium bicarbonate","An oral potassium binder"],"a","Calcium does not lower potassium. It stabilises the myocardial membrane within minutes and buys time for insulin\u2013glucose to shift potassium into cells and for dialysis to remove it. ECG changes are the indication."),Y("ch1b",0,"b","As serum potassium rises, in what order do ECG changes typically appear?",["Peaked T waves \u2192 P-wave flattening and PR prolongation \u2192 QRS widening \u2192 sine-wave pattern","QRS widening \u2192 peaked T waves \u2192 loss of P waves \u2192 sine wave","Prominent U waves \u2192 ST depression \u2192 QT prolongation","Sine wave \u2192 QRS widening \u2192 peaked T waves"],"a","Repolarisation changes come first, followed by slowed atrial and then ventricular conduction. The correlation with the measured level is loose. A normal ECG does not make severe hyperkalaemia safe, and any conduction change is an emergency."),Y("ch2a",1,"a","pH 7.21, PaCO\u2082 3.1 kPa (23 mmHg), HCO\u2083\u207B 9 mmol/L, Na\u207A 138, Cl\u207B 100, albumin 40 g/L. What is the interpretation?",["Raised anion gap metabolic acidosis with appropriate respiratory compensation","Normal anion gap metabolic acidosis","Metabolic acidosis with a coexisting respiratory acidosis","Primary respiratory alkalosis"],"a","Anion gap = 138 \u2212 (100 + 9) = 29 (raised). Winter's formula gives an expected PaCO\u2082 of 1.5 \xD7 9 + 8 = 21.5 \xB1 2 mmHg. The measured 23 mmHg falls within that range, so compensation is appropriate."),Y("ch2b",1,"b","The measured anion gap is 12 mmol/L and the albumin is 20 g/L. What is the corrected gap and its meaning?",["About 17 mmol/L: a raised gap hidden by hypoalbuminaemia","12 mmol/L: normal","About 7 mmol/L: low","About 22 mmol/L: severely raised"],"a","Albumin is the main unmeasured anion. Add about 2.5 mmol/L to the gap for every 10 g/L that albumin falls below 40: 12 + 0.25 \xD7 (40 \u2212 20) = 17. Critically ill patients are exactly the ones in whom this matters."),Y("ch3a",2,"a","In a raised anion gap acidosis, the gap has risen by 14 mmol/L above normal but the bicarbonate has fallen by only 6. What does this suggest?",["A coexisting metabolic alkalosis, such as from vomiting","A coexisting normal anion gap acidosis","Laboratory error","Appropriate respiratory compensation"],"a","The delta ratio is 14/6 \u2248 2.3. When bicarbonate has fallen less than the gap has risen, something is adding bicarbonate back, usually vomiting or diuretics. A ratio below 1 would instead suggest an added normal-gap acidosis."),Y("ch3b",2,"b","A patient with COPD has pH 7.30, PaCO\u2082 8.5 kPa (64 mmHg) and HCO\u2083\u207B 31 mmol/L. What is the best description?",["Acute-on-chronic respiratory acidosis","Acute respiratory acidosis alone","Fully compensated chronic respiratory acidosis","Primary metabolic alkalosis"],"a","For a 24 mmHg rise in PaCO\u2082, acute compensation would give a bicarbonate of about 26 and chronic compensation about 32\u201334. A bicarbonate of 31 with an acidaemic pH lies between the two: a chronic retainer with an acute deterioration."),Y("ch4a",3,"a",'A patient on digoxin has downsloping, "reverse tick" ST depression in the lateral leads and a short QT interval, and no symptoms. What does this indicate?',["Digoxin effect, which shows exposure and not toxicity","Digoxin toxicity requiring antibody fragments","Lateral subendocardial ischaemia","Hypokalaemia"],"a","The characteristic ST scooping appears at therapeutic levels. Toxicity is judged on symptoms (nausea, visual disturbance, confusion), arrhythmias and levels, not on this morphology."),Y("ch4b",3,"b","At a given serum digoxin concentration, which electrolyte abnormality most increases the risk of toxic arrhythmias?",["Hypokalaemia","Hyperkalaemia","Hypermagnesaemia","Hypocalcaemia"],"a","Digoxin and potassium compete for the Na\u207A/K\u207A-ATPase, so low potassium increases digoxin's effect. Hypomagnesaemia and hypercalcaemia also potentiate toxicity. Note that acute digoxin poisoning can itself cause hyperkalaemia.")],references:["Alfonzo A, Harrison A, Baines R, et al. UK Kidney Association clinical practice guidelines: treatment of acute hyperkalaemia in adults. Updated July 2026.","Berend K, de Vries APJ, Gans ROB. Physiological approach to assessment of acid\u2013base disturbances. N Engl J Med. 2014;371(15):1434\u20131445.","Kraut JA, Madias NE. Metabolic acidosis: pathophysiology, diagnosis and management. Nat Rev Nephrol. 2010;6(5):274\u2013285.","Surawicz B, Knilans TK. Chou's Electrocardiography in Clinical Practice. 6th ed. Philadelphia: Saunders Elsevier; 2008."],review:Mt,accreditation:null},{id:"shock-volume",title:"Shock, volume and sodium: one patient, three systems",blurb:"The same patient seen through the circulation, the cord and the blood results, joined by mechanism.",levels:["student","resident","physician"],specialty:"Emergency \xB7 Intensive care \xB7 Acute medicine",minutes:50,maxHours:.75,passMark:.75,accent:"volume",objectives:["Classify shock from its haemodynamic pattern, including neurogenic shock's telltale bradycardia.","Explain how the baroreflex hides early blood loss and what can remove that disguise.","Interpret lactate as a marker of hypoperfusion, with its limits, and state the Sepsis-3 definition of septic shock.","Classify hyponatraemia by volume status and urine studies."],activities:[{ref:"cardio/lesson/venous-return"},{ref:"cardio/lesson/baroreflex"},{ref:"neuro/case/neurogenic"},{ref:"neuro/lesson/cross-domain"},{ref:"labs/lesson/lactate-loop"},{ref:"labs/case/hypovolaemic-hypona"},{ref:"labs/case/siadh"}],questions:[Y("sv1a",0,"a","After a diving accident with a C5 fracture, a patient has BP 78/40 mmHg, heart rate 48/min and warm peripheries. What is the most likely mechanism?",["Neurogenic shock from loss of sympathetic outflow","Haemorrhagic shock","Cardiogenic shock from myocardial contusion","Tension pneumothorax"],"a","A cord lesion above T6 removes sympathetic vasomotor tone and cardiac acceleration, leaving vagal activity unopposed. That produces hypotension with a slow pulse and warm skin. Occult haemorrhage must still be excluded, because the two often coexist in trauma."),Y("sv1b",0,"b","A patient has a raised CVP and pulmonary artery wedge pressure, low cardiac output, high systemic vascular resistance and cold peripheries. Which shock state fits best?",["Cardiogenic shock from left ventricular failure","Hypovolaemic shock","Distributive (septic) shock","Obstructive shock from pulmonary embolism"],"a","High filling pressures on both sides with low output point to pump failure. Pulmonary embolism also raises right-sided pressure and lowers output, but the left-sided wedge pressure is low because the left heart is underfilled. Hypovolaemia lowers all filling pressures."),Y("sv2a",1,"a","A healthy young adult acutely loses about 20% of blood volume. What is typically seen?",["Tachycardia with a narrowed pulse pressure while systolic pressure is still near normal","Profound hypotension with bradycardia","A widened pulse pressure","No change in any vital sign"],"a","The baroreflex defends mean pressure through tachycardia and vasoconstriction. Rising diastolic pressure and falling stroke volume narrow the pulse pressure, and systolic pressure falls late. A normal blood pressure does not exclude significant haemorrhage."),Y("sv2b",1,"b","An elderly patient on bisoprolol is bleeding from the upper GI tract. Her heart rate is 68/min. How should this be interpreted?",["Beta-blockade can blunt the tachycardic response, so a normal rate does not reassure","The normal rate excludes significant blood loss","The bleed must be small because the baroreflex is intact","Bradycardia is expected in all haemorrhage"],"a","Drugs (beta-blockers, rate-limiting calcium channel blockers), pacemakers, age and athletic conditioning all mask the compensatory tachycardia. This is the baroreflex experiment in the lesson, with the reflex partly switched off."),Y("sv3a",2,"a","Which statement about blood lactate in shock is correct?",["A raised lactate usually reflects hypoperfusion, but can also come from adrenergic stimulation, liver failure or drugs such as metformin, so its trend matters more than a single value","A normal lactate excludes shock","Lactate is raised only in septic shock","Lactate should be ignored once blood pressure is normal"],"a","Lactate is a useful, imperfect marker. Clearance with resuscitation is associated with better outcomes, and Surviving Sepsis guidance suggests using it to guide resuscitation. Beta-2 stimulation (for example adrenaline or salbutamol) raises it without any hypoperfusion."),Y("sv3b",2,"b","Under the Sepsis-3 definition, septic shock requires sepsis plus which of the following?",["Vasopressors to maintain MAP \u2265 65 mmHg and a lactate > 2 mmol/L despite adequate fluid resuscitation","Systolic BP below 90 mmHg on a single reading","Lactate above 4 mmol/L alone","A positive blood culture and fever"],"a","Both criteria are required. Together they identify patients with a hospital mortality above 40%."),Y("sv4a",3,"a","A clinically euvolaemic patient has Na\u207A 124 mmol/L, urine osmolality 480 mOsm/kg and urine Na\u207A 55 mmol/L, with normal thyroid and adrenal function and no diuretics. What is the most likely diagnosis?",["SIADH","Hypovolaemic hyponatraemia from vomiting","Primary polydipsia","Thiazide-induced hyponatraemia"],"a","Inappropriately concentrated urine with ongoing natriuresis in a euvolaemic patient, after excluding hypothyroidism, adrenal insufficiency and diuretics, is SIADH. Primary polydipsia produces maximally dilute urine (osmolality below 100 mOsm/kg)."),Y("sv4b",3,"b","A patient has hyponatraemia after several days of vomiting and looks dry. Which urine sodium is expected, and what is the treatment?",["Below 30 mmol/L; restore volume with isotonic saline","Above 40 mmol/L; restrict fluid","Above 40 mmol/L; give demeclocycline","Below 30 mmol/L; restrict fluid"],"a","Extrarenal losses make the kidney avid for sodium, and restoring volume removes the stimulus for ADH secretion. Fluid restriction is the treatment for SIADH, and it would harm this patient. Correct chronic hyponatraemia slowly to avoid osmotic demyelination.")],references:["Vincent JL, De Backer D. Circulatory shock. N Engl J Med. 2013;369(18):1726\u20131734.","Singer M, Deutschman CS, Seymour CW, et al. The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3). JAMA. 2016;315(8):801\u2013810.","Evans L, Rhodes A, Alhazzani W, et al. Surviving Sepsis Campaign: international guidelines for management of sepsis and septic shock 2021. Intensive Care Med. 2021;47(11):1181\u20131247.","Spasovski G, Vanholder R, Allolio B, et al. Clinical practice guideline on diagnosis and treatment of hyponatraemia. Eur J Endocrinol. 2014;170(3):G1\u2013G47."],review:Mt,accreditation:null},{id:"peripheral-localisation",title:"Root, nerve, junction or muscle",blurb:"The bottom four rungs of the neurological ladder, separated by the right muscle pair.",levels:["student","resident","physician"],specialty:"Neurology \xB7 General practice \xB7 Rehabilitation",minutes:40,maxHours:.75,passMark:.75,accent:"flow",objectives:["Separate a root lesion from a nerve lesion using muscles that share a root but not a nerve.","Recognise neuromuscular junction disease: fatigable, ocular and bulbar, with no sensory loss.","Recognise myopathy: proximal, symmetrical weakness with preserved reflexes and sensation.","Distinguish upper from lower motor neuron signs."],activities:[{ref:"neuro/lesson/ladder"},{ref:"neuro/case/ulnar"},{ref:"neuro/case/footdrop"},{ref:"neuro/case/mg"},{ref:"neuro/case/myopathy"}],questions:[Y("pl1a",0,"a","In a patient with foot drop, weakness of which movement suggests an L5 radiculopathy rather than a common peroneal nerve palsy?",["Ankle inversion (tibialis posterior)","Ankle dorsiflexion","Ankle eversion","Great toe extension"],"a","Tibialis posterior is supplied by L5 through the tibial nerve. It is weak in an L5 root lesion and spared in a peroneal palsy. Dorsiflexion, eversion and toe extension are weak in both."),Y("pl1b",0,"b","A patient has weakness of both abductor pollicis brevis and first dorsal interosseous, with sensory loss over the medial forearm. Where is the lesion most likely to be?",["Proximal to the ulnar and median nerves: the C8/T1 root or lower brachial plexus","The ulnar nerve at the elbow","The median nerve at the wrist","The radial nerve in the spiral groove"],"a","Two nerves are involved, but they share the same roots. The medial forearm is supplied by the medial antebrachial cutaneous nerve (C8\u2013T1), which is not part of the ulnar nerve. Together these findings place the lesion above the point where the nerves separate."),Y("pl2a",1,"a","A 35-year-old woman has ptosis and double vision that worsen through the day. The pupils are normal, sensation is normal and reflexes are preserved. Where is the problem most likely to be?",["The neuromuscular junction","The oculomotor nerve","The brainstem","The muscle"],"a","Fatigable, fluctuating ocular weakness with normal pupils and no sensory signs is characteristic of myasthenia gravis. A third nerve palsy from compression usually involves the pupil."),Y("pl2b",1,"b","Which bedside finding supports myasthenia gravis?",["Ptosis that worsens during sustained upgaze and improves after an ice pack","A dilated, unreactive pupil","Loss of the corneal reflex","Fasciculations of the tongue"],"a","Sustained activity depletes the neuromuscular safety margin, and cooling improves transmission. Pupillary involvement points to the third nerve, and fasciculation points to the lower motor neuron."),Y("pl3a",2,"a","A 58-year-old woman has had three months of difficulty rising from chairs and lifting her arms. Weakness is proximal and symmetrical, reflexes and sensation are normal, and creatine kinase is raised. What is the most likely level of the problem?",["Muscle (myopathy)","Peripheral nerve (polyneuropathy)","Anterior horn cell (motor neuron disease)","Neuromuscular junction"],"a","Proximal, symmetrical weakness with preserved reflexes and sensation, together with a raised CK, is the pattern of myopathy. Polyneuropathy is distal, loses reflexes early and usually has sensory signs."),Y("pl3b",2,"b","Which finding argues against myopathy?",["Early loss of ankle reflexes with stocking-distribution sensory loss","Difficulty climbing stairs","Neck flexor weakness","Symmetrical proximal weakness"],"a","Sensory loss and early loss of reflexes point to the peripheral nerve. Myopathies spare sensation and keep reflexes until weakness is severe."),Y("pl4a",3,"a","Which combination indicates an upper motor neuron lesion?",["Spasticity, hyperreflexia and an extensor plantar response","Wasting, fasciculation and areflexia","Fatigable weakness with normal reflexes","Weakness in a single peripheral nerve territory"],"a","Upper motor neuron lesions release spinal reflexes from descending inhibition. Wasting and fasciculation are signs of the lower motor neuron."),Y("pl4b",3,"b","Wasting, fasciculation and loss of reflexes confined to one myotome point to a lesion where?",["The lower motor neuron: anterior horn cell, root or nerve","The internal capsule","The cerebral cortex","The neuromuscular junction"],"a","These are lower motor neuron signs. Their distribution then decides between horn cell, root, plexus and nerve.")],references:["Guarantors of Brain. Aids to the Examination of the Peripheral Nervous System. Elsevier (current edition).","Campbell WW, Barohn RJ. DeJong's The Neurologic Examination. 8th ed. Philadelphia: Wolters Kluwer; 2020.","Gilhus NE. Myasthenia gravis. N Engl J Med. 2016;375(26):2570\u20132581."],review:Mt,accreditation:null},{id:"central-localisation",title:"Brainstem, cord and visual pathways",blurb:"Crossed signs, the forehead rule, cord syndromes and the swinging torch.",levels:["student","resident","physician"],specialty:"Neurology \xB7 Stroke \xB7 Emergency medicine",minutes:55,maxHours:1,passMark:.75,accent:"ecg",objectives:["Distinguish upper from lower motor neuron facial weakness using the forehead.","Localise brainstem lesions from crossed signs: an ipsilateral cranial nerve with contralateral long-tract signs.","Recognise hemicord and central cord syndromes from the dissociation of sensory modalities.","Localise visual field defects and a relative afferent pupillary defect."],activities:[{ref:"neuro/lesson/forehead"},{ref:"neuro/case/bells"},{ref:"neuro/case/umn-face"},{ref:"neuro/lesson/brainstem-rule"},{ref:"neuro/case/wallenberg"},{ref:"neuro/case/weber"},{ref:"neuro/lesson/two-systems"},{ref:"neuro/case/bs"},{ref:"neuro/case/central"},{ref:"neuro/case/chiasm"},{ref:"neuro/case/rapd"}],questions:[Y("cl1a",0,"a","A patient has right facial weakness involving the forehead, loss of taste on the anterior two-thirds of the tongue on the right, and hyperacusis. Where is the lesion?",["Right facial nerve (lower motor neuron)","Left internal capsule","Right motor cortex","Left facial nerve"],"a","Forehead involvement means the lesion is in the nucleus or the nerve. Taste loss and hyperacusis place it proximal to the branches to the chorda tympani and stapedius."),Y("cl1b",0,"b","Weakness of the left lower face with the forehead spared, together with a weak left arm, points to a lesion where?",["Right cerebral hemisphere or internal capsule","Left facial nerve","Left pons","Right facial nerve"],"a","The upper face receives corticobulbar input from both hemispheres, so a unilateral upper motor neuron lesion spares the forehead. Face and arm on the same side point to the opposite hemisphere."),Y("cl2a",1,"a","A patient has a right Horner syndrome, loss of pain and temperature sensation on the right face and left body, right limb ataxia, hoarseness and dysphagia. Where is the lesion?",["Right lateral medulla (vertebral artery or PICA territory)","Left lateral medulla","Right medial medulla","Right internal capsule"],"a","This is Wallenberg syndrome. The trigeminal spinal tract (ipsilateral face) and the already crossed spinothalamic tract (contralateral body) lie side by side in the lateral medulla, and together they produce the crossed sensory loss."),Y("cl2b",1,"b","A left oculomotor palsy with right-sided hemiparesis localises to where?",["Left ventral midbrain (Weber syndrome)","Right ventral midbrain","Left medial medulla","Right internal capsule"],"a","The third nerve fascicle and the cerebral peduncle lie together in the ventral midbrain. The corticospinal fibres there have not yet crossed, so the hemiparesis is contralateral."),Y("cl3a",2,"a","Below T10 there is left leg weakness with loss of vibration and joint posit
