name: Deploy to GitHub Pages

# Builds the app from source and publishes it to the gh-pages branch,
# which GitHub Pages serves (Settings → Pages → Deploy from a branch → gh-pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (the figure contract test) needs Node 22 or later.
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: source
      # The same gate as before a PR: typecheck, every test suite, the smoke test and the builds.
      # (Nothing in it needs the native canvas, so --ignore-scripts above is enough.)
      - run: npm run verify
        working-directory: source
      - run: node scripts/build-vp-demo.mjs
        working-directory: source
      - name: Publish to gh-pages
        run: |
          mkdir -p _site
          cp source/dist/lab.html _site/index.html
          # The playtest copy: the same app, which records what the person does on their device (session-record.ts).
          mkdir -p _site/playtest
          cp source/dist/lab.html _site/playtest/index.html
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
